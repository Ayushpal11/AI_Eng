es the data"},{"m":"Nested JSON is as reliable as flat","r":"Deeper nesting → more failure points. Flatten when possible"},{"m":"I can always parse the JSON from mixed output","r":"Brittle. Model output varies. Use enforcement, not regex extraction"}],"next":[{"name":"Function Calling / Tool Use","desc":"the strongest enforcement mechanism"},{"name":"Few-Shot Examples","desc":"show the exact JSON format you want"},{"name":"Evals","desc":"schema validation belongs in your eval suite"},{"name":"Context Window Management","desc":"large schemas eat tokens in every request"}],"quiz":[{"q":"Your model returns {\"name\": \"John\", \"age\": \"30\"} but age should be int. Pydantic raises a validation error. How do you fix this upstream?","options":["Add a try/except around the Pydantic call","Add an explicit type instruction in prompt: 'age must be an integer, not a string'","Use a different model","Increase max_tokens"],"correct":1,"explain":"Fix it upstream in the prompt/schema definition. Tell the model explicitly that age is an integer, or use function calling which enforces the type via the JSON schema."},{"q":"What's the difference between JSON mode and function calling for structured output?","options":["JSON mode is faster; function calling is more accurate","JSON mode guarantees valid JSON syntax; function calling enforces your specific schema","They're equivalent — just different API names","JSON mode works offline; function calling requires internet"],"correct":1,"explain":"JSON mode only guarantees syntactically valid JSON — the structure might not match your schema. Function calling enforces your exact schema via tool definition."},{"q":"Model output is cut off mid-JSON because it hit max_tokens. How do you detect this?","options":["Check if response.stop_reason == 'max_tokens', then handle/retry","The API always returns an error when JSON is truncated","Parse the JSON — it will always raise a JSONDecodeError","Ask the model if its output was complete"],"correct":0,"explain":"Check stop_reason field in the API response. If stop_reason == 'max_tokens' (not 'end_turn'), the output was truncated. Increase max_tokens or reduce output size."}]},{"id":8,"slug":"context-window-management","domainKey":"prompting","title":"Context Window Management","level":"Beginner","conceptMap":"Context Window Management\n│\n├── What Goes In (budget allocation)\n│   ├── System prompt (fixed cost, every request)\n│   ├── Retrieved documents (RAG, variable)\n│   ├── Conversation history (grows over turns)\n│   ├── Current user message\n│   └── Output budget (reserved for response)\n│\n├── Strategies to Fit More\n│   ├── Selective inclusion — only include relevant info\n│   ├── Summarization — compress prior conversation\n│   ├── Sliding window — drop oldest turns\n│   ├── RAG — retrieve only relevant chunks instead of stuffing all docs\n│   └── Truncation — last resort, explicit and logged\n│\n├── Failure Modes\n│   ├── Exceeding context limit → API error\n│   ├── Lost-in-the-middle — model ignores content far from edges\n│   ├── Context pollution — irrelevant content degrades answers\n│   └── Growing cost — longer context = more tokens = higher cost per call\n│\n└── Connects To\n    ├── Tokens & Tokenization (context measured in tokens)\n    ├── Retrieval / RAG (alternative to stuffing)\n    ├── Memory Systems (what to store vs what to retrieve)\n    └── Cost & Latency Optimization (context size = cost)","sections":[{"title":"Where This Fits","md":"The context window is a finite resource shared between everything the model needs to see — instructions, documents, history, and room to respond. Managing it well separates naive AI integrations (that break or degrade at scale) from production-grade systems."},{"title":"Core Mechanism","md":"### The token budget model\n\n```python\n# Claude Sonnet: 200k input + output tokens total\n# Budget breakdown for a typical RAG chatbot:\n\nsystem_prompt_tokens     = 500    # persona + instructions\nretrieved_docs_tokens    = 8_000  # 4 chunks × 2k tokens each\nconversation_history     = 3_000  # last 10 turns\ncurrent_user_message     = 200    # this turn's question\noutput_budget            = 2_000  # reserved for response\n# ─────────────────────────────────\ntotal                    = 13_700  # well within 200k for this model\n\n# Problem: after 100 turns of 300 tokens each:\nconversation_history     = 30_000  # 100 turns × 300 tokens\n# Now retrieving 4 docs also costs 8k, system 500, current 200...\n# Total: 38,700 tokens — still fine for 200k, but costs 3x more per call\n```\n\n### Naive vs smart context assembly\n\n```python\n# NAIVE: stuff everything\ndef build_context_naive(user_query, all_documents, conversation_history):\n    context = \"\\n\".join(all_documents)       # ALL docs, always\n    history = \"\\n\".join(conversation_history) # FULL history, always\n    return f\"{context}\\n\\n{history}\\n\\nUser: {user_query}\"\n# Problems: massive token cost, irrelevant content, context pollution\n\n# SMART: selective inclusion\ndef build_context_smart(user_query, document_store, conversation_history, max_tokens=8000):\n    # Retrieve only relevant docs\n    relevant_docs = retrieve_top_k(user_query, document_store, k=3, max_tokens=4000)\n    \n    # Summarize old history, keep recent turns verbatim\n    if token_count(conversation_history) > 3000:\n        old_history = conversation_history[:-5]  # everything before last 5 turns\n        recent_history = conversation_history[-5:]\n        compressed = summarize(old_history)      # LLM call to compress\n    else:\n        compressed = \"\"\n        recent_history = conversation_history\n    \n    return build_prompt(relevant_docs, compressed, recent_history, user_query)\n```\n\n### Conversation summarization pattern\n\n```python\nSUMMARIZE_PROMPT = \"\"\"\nSummarize the key facts, decisions, and context from this conversation.\nBe concise — include only information relevant to future questions.\n\nConversation:\n{conversation}\n\nSummary:\"\"\"\n\ndef compress_history(turns: list[dict]) -> str:\n    conversation = format_turns(turns)\n    return llm_call(SUMMARIZE_PROMPT.format(conversation=conversation))\n\n# Use in multi-turn system:\n# Every N turns, compress old history into a summary\n# Keep summary + last N turns verbatim\n```\n\n### Sliding window (simplest approach)\n\n```python\ndef trim_history(history: list[dict], max_tokens: int = 4000) -> list[dict]:\n    \"\"\"Keep most recent turns that fit within token budget.\"\"\"\n    trimmed = []\n    running_tokens = 0\n    \n    for turn in reversed(history):\n        turn_tokens = count_tokens(turn[\"content\"])\n        if running_tokens + turn_tokens > max_tokens:\n            break\n        trimmed.insert(0, turn)\n        running_tokens += turn_tokens\n    \n    return trimmed\n```"},{"title":"Analogy","md":"The context window is like a whiteboard in a meeting room. Everyone in the meeting can see everything on it — but the board has limited space. You have to decide what stays up (critical constraints, current task), what gets erased (old decisions already acted on), and what gets a sticky note summary (conversation history you might need but don't need verbatim)."},{"title":"What This Means in Practice","md":"- **Measure your token budget** before building — know system/docs/history/output allocations\n- **Lost-in-the-middle is real** — put the most important content at the start and end of context, not the middle\n- **Conversation history is the fastest-growing cost** — always cap it\n- **Summarization costs one extra call** but saves many tokens over long sessions — usually worth it\n- **Context pollution degrades quality** — irrelevant docs in context actively hurt answers\n- **Always reserve output tokens explicitly** — don't let history crowd out the model's response space"}],"socratic":["Your chatbot's context is 2000 tokens at turn 1. At turn 50, it's 20,000 tokens. Your API cost is 10x higher per call. What are three strategies to reduce this without degrading quality?","You have 50 documents (each 2000 tokens). The user asks a specific question. Stuffing all 50 takes 100k tokens. What's the right architecture?","You use a sliding window (keep last 10 turns). A user references something they said in turn 3 (now dropped). What breaks and how do you fix it?"],"socraticIntro":"","myths":[{"m":"Bigger context = I can ignore context management","r":"Bigger context costs proportionally more and still has lost-in-the-middle issues"},{"m":"The model reads the whole context equally","r":"Attention is unequal — edges get more weight than middle"},{"m":"Truncating old history is fine","r":"Abrupt truncation breaks coherence; summarize instead"},{"m":"Context management is only for chat apps","r":"Any pipeline with accumulated state (RAG, agent memory) needs it"},{"m":"I'll optimize this later","r":"Context cost compounds with every request; a 10x context = 10x cost"}],"next":[{"name":"Retrieval / RAG","desc":"the primary alternative to stuffing full documents in context"},{"name":"Memory Systems","desc":"architectural patterns for what to remember vs retrieve"},{"name":"Cost & Latency Optimization","desc":"context size is the biggest driver of both"},{"name":"Tokens & Tokenization","desc":"you need to count tokens to manage the budget"}],"quiz":[{"q":"Your chatbot's context grows from 2k to 20k tokens across 50 turns. Three strategies to reduce this?","options":["Increase the context window, use a better model, add more examples","Summarize prior conversation, use a sliding window, retrieve only relevant history with RAG","Reduce output max_tokens, use JSON mode, add system prompt","Lower temperature, use fewer examples, compress the system prompt"],"correct":1,"explain":"Summarization compresses old turns, sliding window drops oldest turns, and RAG retrieves only relevant prior history — all reduce context size while preserving quality."},{"q":"You use a sliding window that keeps the last 10 turns. A user references something from turn 3 (now dropped). What breaks?","options":["Nothing — the model infers from later context","The model has no information about turn 3 and will confabulate or say it doesn't know","The API returns a 404 error","Token cost doubles"],"correct":1,"explain":"Dropped context is gone — the model has no access to turn 3's content. Design around this: summarize important facts into a running context before dropping turns."},{"q":"Context pollution means:","options":["Prompt injection via user input","Including irrelevant content that causes the model to give worse answers","Exceeding the context limit","Cross-user data contamination"],"correct":1,"explain":"Context pollution = irrelevant content dilutes attention. If you stuff 50 documents and only 2 are relevant, the model's attention is spread thin and answer quality degrades."}]},{"id":9,"slug":"chain-of-thought","domainKey":"prompting","title":"Chain-of-Thought & Reasoning","level":"Beginner","conceptMap":"Chain-of-Thought & Reasoning\n│\n├── What it is\n│   ├── Model reasons step-by-step before answering\n│   ├── Intermediate reasoning improves final answer quality\n│   └── Works because next-token prediction benefits from prior reasoning tokens\n│\n├── Variants\n│   ├── Zero-shot CoT — \"Let's think step by step.\"\n│   ├── Few-shot CoT — examples showing reasoning chains\n│   ├── Scratchpad — explicit \u003cthinking> block before answer\n│   └── Extended thinking — model's internal CoT (Claude, o1)\n│\n├── When It Helps vs Doesn't\n│   ├── HELPS: math, logic, multi-step reasoning, planning\n│   ├── HURTS (or neutral): simple factual retrieval, classification, fast responses\n│   └── HURTS: when CoT leads model to overthink simple answers\n│\n├── Engineering Considerations\n│   ├── Reasoning tokens cost money (but improve quality)\n│   ├── Can strip reasoning from final output shown to users\n│   └── Scratchpad visible to user = potential info leak\n│\n└── Connects To\n    ├── Prompt Structure (reasoning instruction placement)\n    ├── Agent Loop (CoT is internal reasoning per step)\n    ├── Model Failure Modes (CoT reduces hallucination on reasoning tasks)\n    └── Cost & Latency (more tokens = higher cost + latency)","sections":[{"title":"Where This Fits","md":"Chain-of-thought is what separates models that \"think out loud\" from those that guess. For any task requiring reasoning — not just retrieval — CoT is often the highest-leverage prompt change you can make."},{"title":"Core Mechanism","md":"### Performance delta: with vs without CoT\n\n```\nTask: \"A train leaves city A at 2pm going 60mph. Another leaves city B \nat 3pm going 80mph. Cities are 280 miles apart. When do they meet?\"\n\n# Without CoT\nAnswer: \"4:30pm\"  ← often wrong\n\n# With zero-shot CoT: \"Let's think step by step.\"\nReasoning:\n- Train A starts at 2pm, speed 60mph\n- Train B starts at 3pm, speed 80mph  \n- At 3pm (when B starts), A has traveled 60 miles, so gap = 220 miles\n- Combined closing speed = 60 + 80 = 140mph\n- Time to close 220 miles = 220/140 = 1.57 hours ≈ 1h34m\n- They meet at 3pm + 1h34m = 4:34pm\n\nAnswer: 4:34pm  ← correct\n```\n\n### Zero-shot CoT (simplest)\n\n```python\nprompt = \"\"\"\nSolve this problem. Think through it step by step before giving your answer.\n\nProblem: A store sells apples for $0.50 each and oranges for $0.75 each. \nSarah buys 4 apples and 3 oranges. She pays with a $5 bill. How much change does she get?\n\"\"\"\n# Adding \"Think through it step by step\" alone boosts accuracy significantly\n```\n\n### Few-shot CoT (examples with reasoning chains)\n\n```python\nprompt = \"\"\"\nSolve math word problems step by step.\n\nProblem: Tom has 15 marbles. He gives 1/3 to his sister and 1/5 to his friend. How many does he keep?\nReasoning:\n- 1/3 of 15 = 5 marbles to sister\n- 1/5 of 15 = 3 marbles to friend\n- Marbles given away = 5 + 3 = 8\n- Marbles kept = 15 - 8 = 7\nAnswer: 7\n\nProblem: A rectangle is 12cm long and 8cm wide. What is its perimeter?\nReasoning:\n- Perimeter = 2 × (length + width)\n- = 2 × (12 + 8)\n- = 2 × 20\n- = 40cm\nAnswer: 40cm\n\nProblem: {new_problem}\nReasoning:\n\"\"\"\n```\n\n### Scratchpad pattern (separate reasoning from output)\n\n```python\n# Claude: extended thinking API\nresponse = client.messages.create(\n    model=\"claude-opus-4-5\",\n    max_tokens=16000,\n    thinking={\n        \"type\": \"enabled\",\n        \"budget_tokens\": 10000  # tokens reserved for internal reasoning\n    },\n    messages=[{\"role\": \"user\", \"content\": \"Analyze the pros and cons of this business decision...\"}]\n)\n\n# Response contains both thinking and final answer\nfor block in response.content:\n    if block.type == \"thinking\":\n        internal_reasoning = block.thinking  # don't show to user\n    elif block.type == \"text\":\n        user_facing_answer = block.text  # show this\n\n# Alternatively, explicit scratchpad in prompt:\nprompt = \"\"\"\nBefore answering, use \u003cthinking> tags to reason through the problem.\nThen provide your final answer in \u003canswer> tags.\n\nQuestion: {question}\n\"\"\"\n# Parse: extract content between \u003canswer> tags for the response\n```\n\n### When CoT hurts\n\n```python\n# Don't use CoT for:\n# 1. Simple classification\n\"Is this email spam? Yes/No\"  # CoT adds latency, no accuracy gain\n\n# 2. Factual lookup\n\"What is the capital of France?\"  # CoT wastes tokens\n\n# 3. Speed-critical paths\n# CoT generates 3-10x more tokens → proportional latency increase\n\n# Rule: use CoT when the task requires reasoning you can trace\n# Skip CoT for tasks a human could answer in \u003c2 seconds without thinking\n```"},{"title":"Analogy","md":"Chain-of-thought is like showing your work on a math test. The model's next-token prediction is better when it has already written the intermediate steps — the reasoning tokens in the context literally help it compute the right answer. Without them, it's like asking someone to multiply 347 × 89 in their head vs. on paper."},{"title":"What This Means in Practice","md":"- **\"Think step by step\"** is the single highest-leverage zero-cost prompt change for reasoning tasks\n- **CoT tokens cost money** — budget 3-10x more tokens for reasoning vs. direct answer\n- **Strip the scratchpad** from user-facing output — reasoning is internal, answer is external\n- **Extended thinking (Claude o1-style)** is CoT baked into the model — you don't prompt for it, you pay for it\n- **Evaluate CoT impact** — always compare with/without on your actual task, not in general\n- **Don't CoT everything** — classification, retrieval, simple lookups are slower and no more accurate with CoT"}],"socratic":["You're building a customer support bot. The model needs to: (a) classify ticket type, (b) check if the issue matches known solutions, (c) draft a response. Which of these steps benefit from CoT and which don't?","Your CoT prompt generates 2000 reasoning tokens before the 200-token answer. At $3/1M tokens, what's the cost per request, and how does it compare to direct answering?","A user can see the model's `\u003cthinking>` block. Your system prompt contains confidential pricing rules. What's the risk and how do you mitigate it?"],"socraticIntro":"","myths":[{"m":"CoT always improves output","r":"Only for reasoning tasks. Neutral or negative for simple tasks"},{"m":"CoT is free","r":"Reasoning tokens are charged like any other tokens (often 5-10x more)"},{"m":"I need few-shot CoT to benefit","r":"Zero-shot \"think step by step\" often captures most of the gain"},{"m":"Extended thinking = CoT prompting","r":"Extended thinking is model-internal; CoT prompting is user-visible reasoning"},{"m":"Showing CoT to users is fine","r":"Reasoning can expose internal logic, system context, or sensitive info"}],"next":[{"name":"Agent Loop & Harness","desc":"CoT is the reasoning mechanism inside each agent step"},{"name":"Model Failure Modes","desc":"CoT reduces hallucination on reasoning tasks"},{"name":"Cost & Latency Optimization","desc":"reasoning tokens are the biggest cost driver per request"},{"name":"Evals","desc":"measure CoT vs direct on your task before adopting it"}],"quiz":[{"q":"Classifying support tickets (billing/tech/other) — does CoT help?","options":["Yes — always improves accuracy","No — classification is a simple pattern match; CoT adds cost with little benefit","Only if the ticket is over 100 words","Yes, but only with few-shot CoT"],"correct":1,"explain":"CoT helps with multi-step reasoning, math, logic. Simple classification doesn't benefit — the model doesn't need to reason through steps to pick a category."},{"q":"CoT generates 2000 reasoning tokens before a 200-token answer. At $3/1M tokens, cost per request?","options":["$0.0006","$0.0001","$0.006","$0.06"],"correct":0,"explain":"2000 + 200 = 2200 tokens × ($3 / 1,000,000) = $0.0066 ≈ $0.007 per request. Actually ~$0.0066 — closest to the $0.0006 ballpark at this price. At scale this adds up significantly vs direct answering."},{"q":"Your \u003cthinking> block is visible to users and contains confidential pricing rules. Risk?","options":["No risk — thinking blocks are encrypted","Users can read the pricing rules in the thinking block output","The model will refuse to reveal thinking content","Only a risk with temperature > 0"],"correct":1,"explain":"If reasoning/thinking output is returned to users, any confidential content in your system prompt that the model reasons about becomes visible. Strip thinking blocks before returning to users."}]},{"id":10,"slug":"embeddings","domainKey":"rag","title":"Embeddings","level":"Beginner","conceptMap":"Embeddings\n│\n├── What they are\n│   ├── Dense float vectors (e.g. 1536 dimensions)\n│   ├── Text → numbers a model can compare\n│   └── Trained to cluster semantically similar text nearby\n│\n├── How similarity works\n│   ├── Cosine similarity: dot product / (|a| × |b|)\n│   ├── Range: -1 (opposite) to 1 (identical)\n│   └── Euclidean distance also used but cosine more common\n│\n├── Embedding models\n│   ├── OpenAI: text-embedding-3-small (1536d), text-embedding-3-large (3072d)\n│   ├── Cohere: embed-english-v3.0\n│   ├── Open source: sentence-transformers (all-MiniLM-L6-v2)\n│   └── Fine-tuned: domain-specific retrieval\n│\n├── Practical Dimensions\n│   ├── COST: charged per token embedded (cheap vs LLM)\n│   ├── DIMENSIONALITY: higher = more expressive, slower ANN search\n│   ├── DOMAIN FIT: general embeddings fail on specialized vocab\n│   └── CROSS-ENCODER vs BI-ENCODER: see Reranking\n│\n└── Connects To\n    ├── Vector & Hybrid Search (how embeddings are searched)\n    ├── Chunking Strategies (what gets embedded)\n    ├── Reranking (bi-encoder vs cross-encoder distinction)\n    └── RAG vs Full Context (embeddings enable retrieval)","sections":[{"title":"Where This Fits","md":"RAG systems convert text into vectors so that \"find relevant documents\" becomes \"find nearest vectors\" — a solvable math problem. Embeddings are the translation layer between human language and the geometry a search index understands."},{"title":"Core Mechanism","md":"An embedding model is a neural network trained to map text to a fixed-size float array where semantic similarity ≈ geometric proximity.\n\n```python\nfrom openai import OpenAI\n\nclient = OpenAI()\n\ndef embed(text: str) -> list[float]:\n    response = client.embeddings.create(\n        model=\"text-embedding-3-small\",\n        input=text\n    )\n    return response.data[0].embedding  # list of 1536 floats\n\nimport numpy as np\n\ndef cosine_similarity(a: list[float], b: list[float]) -> float:\n    a, b = np.array(a), np.array(b)\n    return float(np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b)))\n\n# Example\nvec1 = embed(\"How do I cancel my subscription?\")\nvec2 = embed(\"Steps to unsubscribe from the service\")\nvec3 = embed(\"What is the weather in Paris?\")\n\nprint(cosine_similarity(vec1, vec2))  # ~0.92 — semantically close\nprint(cosine_similarity(vec1, vec3))  # ~0.41 — semantically distant\n```\n\n### Dimensionality tradeoffs\n\n| Dimensions | Model | Speed | Quality |\n|-----------|-------|-------|---------|\n| 384 | all-MiniLM-L6-v2 | very fast | decent |\n| 1536 | text-embedding-3-small | fast | good |\n| 3072 | text-embedding-3-large | slower | best |\n\nOpenAI's v3 models support **Matryoshka embeddings** — you can truncate to fewer dimensions with minimal quality loss, useful for cost/speed tradeoffs.\n\n### Fine-tuning embeddings\n\nGeneral embeddings struggle with domain-specific jargon. \"Churn\" in SaaS ≠ \"churn\" in dairy. Fine-tuning on (query, relevant_doc, irrelevant_doc) triplets improves retrieval on specialized corpora."},{"title":"Analogy","md":"Embeddings are like GPS coordinates for meaning. \"Cancel subscription\" and \"stop my plan\" end up at nearly the same GPS location in 1536-dimensional space, even though they share no words. Searching for relevant docs becomes: \"find everything within X meters of this query's coordinates.\""},{"title":"What This Means in Practice","md":"- **Embed once, search many times** — embed your document corpus offline, store vectors; only embed queries at runtime\n- **Model must match** — always embed queries and docs with the same model; mixing models breaks similarity\n- **Embedding is cheap** — text-embedding-3-small is ~$0.02/1M tokens vs $2.50/1M for GPT-4o input\n- **Domain mismatch is silent failure** — general embeddings on medical/legal/finance text often underperform; test before assuming they work\n- **Normalize vectors** — most vector DBs do this automatically; raw dot product without normalization gives wrong similarity scores"}],"socratic":["You embed 1M documents with `text-embedding-3-small`, then switch to `text-embedding-3-large` for query embedding to get better quality. What's wrong with this approach?","A user searches \"heart attack symptoms\" and your system retrieves docs about \"myocardial infarction treatment\" with low cosine similarity. What's likely the root cause?","You have 500K documents and embedding latency at query time must be \u003c100ms. What architectural decision does this force?"],"socraticIntro":"","myths":[{"m":"Embeddings capture true meaning","r":"They capture statistical co-occurrence patterns from training data, not semantic truth"},{"m":"Higher dimensions always = better","r":"Past a point, quality plateaus while search cost grows; Matryoshka truncation often works fine"},{"m":"I can mix embedding models","r":"Never — similarity scores are only meaningful within the same model's vector space"},{"m":"Embeddings are model-specific outputs, not reusable","r":"You can store and reuse embeddings as long as you don't change the embedding model"},{"m":"Cosine similarity always gives 0–1","r":"Only for non-negative vectors; text embeddings can be negative, giving scores from -1 to 1"}],"next":[{"name":"Chunking Strategies","desc":"what you embed matters as much as how you embed it"},{"name":"Vector & Hybrid Search","desc":"how stored embeddings are searched efficiently"},{"name":"Reranking","desc":"why fast ANN retrieval alone isn't enough"},{"name":"Fine-tuning Embeddings","desc":"when general embeddings fail on your domain"}],"quiz":[{"q":"You embed 1M docs with text-embedding-3-small, then use text-embedding-3-large for query embedding. What's wrong?","options":["3-large costs too much for queries","Different models produce vectors in different spaces — cosine similarity between them is meaningless","3-large embeddings are too large for the vector index","This is the recommended hybrid approach"],"correct":1,"explain":"Embeddings only have meaning when compared within the same model's vector space. Mixing models produces meaningless similarity scores — always use the same model for indexing and querying."},{"q":"User searches 'heart attack symptoms.' Your system retrieves 'myocardial infarction treatment' with low cosine similarity. Root cause?","options":["The vector database is broken","General embedding model lacks medical vocabulary — doesn't know myocardial infarction = heart attack","The chunk size is too large","BM25 search would have the same problem"],"correct":1,"explain":"General embedding models may not have learned that 'heart attack' and 'myocardial infarction' are semantically equivalent. Domain-specific embeddings or hybrid search with BM25 keyword matching fixes this."},{"q":"You have 500k documents. Embedding latency at query time must be \u003c 100ms. What architectural decision does this force?","options":["Embed at query time with a fast model","Pre-compute and store document embeddings in a vector index — only query embedding happens at runtime","Use smaller chunks to reduce embedding time","Use CPU instead of GPU for embeddings"],"correct":1,"explain":"Query embedding is fast (~10ms). Document embedding at query time for 500k docs would take minutes. Pre-compute all document embeddings and store them in a vector index — query time only embeds the single query."}]},{"id":11,"slug":"chunking-strategies","domainKey":"rag","title":"Chunking Strategies","level":"Beginner","conceptMap":"Chunking Strategies\n│\n├── Why chunk?\n│   ├── Embedding models have token limits (~512–8192 tokens)\n│   ├── Smaller chunks = more precise retrieval\n│   └── Larger chunks = more context per result\n│\n├── Strategy types\n│   ├── Fixed-size\n│   │   ├── Split by character count (e.g. every 500 chars)\n│   │   ├── Split by token count (e.g. every 256 tokens)\n│   │   └── Overlap window (e.g. 50 token overlap between chunks)\n│   │\n│   ├── Semantic / structural\n│   │   ├── Split at sentence boundaries\n│   │   ├── Split at paragraph / heading boundaries\n│   │   └── Recursive character splitting (LangChain default)\n│   │\n│   └── Advanced\n│       ├── Parent-child chunking (embed small, retrieve large)\n│       ├── Proposition chunking (atomic facts as chunks)\n│       └── Late chunking (embed full doc, then pool per chunk)\n│\n├── Key parameters\n│   ├── chunk_size: target size in tokens/chars\n│   ├── chunk_overlap: tokens shared between adjacent chunks\n│   └── separators: [\"\\n\\n\", \"\\n\", \". \", \" \", \"\"]\n│\n└── Connects To\n    ├── Embeddings (each chunk gets one embedding)\n    ├── Vector & Hybrid Search (chunks are the retrieval unit)\n    ├── Reranking (bad chunks hurt even with good reranker)\n    └── Context Window Management (retrieved chunks consume context)","sections":[{"title":"Where This Fits","md":"Before you can retrieve anything, you must decide what the retrievable unit is. Chunking determines the granularity of your retrieval — too small and you lose context, too large and you dilute relevance. Most RAG failures trace back to bad chunking decisions."},{"title":"Core Mechanism","md":"### Fixed-size chunking\n\n```python\nfrom langchain.text_splitter import RecursiveCharacterTextSplitter\n\n# LangChain's default — tries to split at paragraph, then sentence, then word\nsplitter = RecursiveCharacterTextSplitter(\n    chunk_size=512,       # tokens per chunk (approx)\n    chunk_overlap=64,     # tokens shared with adjacent chunk\n    separators=[\"\\n\\n\", \"\\n\", \". \", \" \", \"\"]  # tried in order\n)\n\nchunks = splitter.split_text(document_text)\nprint(f\"{len(chunks)} chunks from {len(document_text)} chars\")\n```\n\n### Semantic chunking\n\n```python\nfrom langchain_experimental.text_splitter import SemanticChunker\nfrom langchain_openai import OpenAIEmbeddings\n\n# Splits where embedding similarity drops — natural topic boundaries\nsplitter = SemanticChunker(\n    embeddings=OpenAIEmbeddings(),\n    breakpoint_threshold_type=\"percentile\",  # split at similarity valleys\n    breakpoint_threshold_amount=95\n)\n\nchunks = splitter.split_text(document_text)\n```\n\n### Parent-child chunking (best of both worlds)\n\n```python\n# Index small chunks for precise retrieval\n# Return their parent (larger) chunk as context to the model\n\nchild_splitter = RecursiveCharacterTextSplitter(chunk_size=200)\nparent_splitter = RecursiveCharacterTextSplitter(chunk_size=800)\n\n# Store: child_chunk → parent_chunk mapping\n# Search: embed query → find best child chunks → retrieve parent chunks\n```\n\n### Chunk size impact on retrieval\n\n| Chunk size | Retrieval precision | Context quality | Cost |\n|-----------|--------------------|-----------------|----|\n| 128 tokens | High | Poor (truncated thoughts) | Low |\n| 512 tokens | Good | Good | Medium |\n| 1024 tokens | Lower | Better | Higher |\n| 2048+ tokens | Poor | Best | High |"},{"title":"Analogy","md":"Chunking is like indexing a book. Fixed-size chunking is cutting every 10 pages regardless of chapter breaks — fast but arbitrary. Semantic chunking is cutting at chapter boundaries — slower to set up but each chunk is a coherent unit of thought. Parent-child is the index entry (small, precise) pointing to the full chapter (large, rich context)."},{"title":"What This Means in Practice","md":"- **Start with 512-token chunks, 64-token overlap** — a safe default for most text\n- **Respect document structure** — always prefer splitting at `\\n\\n` (paragraphs) before `\\n` before spaces; RecursiveCharacterTextSplitter does this\n- **Overlap is not optional** — without overlap, facts that span a chunk boundary are retrieval dead zones\n- **Test retrieval quality, not just ingestion** — run 20 representative queries and inspect what gets retrieved; bad chunking is invisible until you look\n- **Code and structured data** — chunk at function/class boundaries, not arbitrary character counts; a half-function chunk is useless\n- **PDFs and HTML** — strip formatting before chunking; embedded tables/headers confuse fixed-size splitters"}],"socratic":["Your RAG system retrieves the right document section but the answer is wrong. The relevant fact spans the last sentence of chunk 5 and the first sentence of chunk 6. What chunking parameter would have prevented this?","You're building RAG over a 500-page legal contract. Each clause is 2–3 sentences. Would you use 512-token fixed chunks or clause-boundary semantic chunks? Why?","With parent-child chunking, you embed and index the child chunks. What do you actually return to the LLM when a child chunk matches?"],"socraticIntro":"","myths":[{"m":"Smaller chunks always = better retrieval","r":"Tiny chunks lose surrounding context; the retrieved chunk may be uninterpretable alone"},{"m":"Overlap wastes storage","r":"Storage is cheap; overlap prevents missing cross-boundary facts, which kills answer quality"},{"m":"One chunking strategy fits all docs","r":"Code, legal docs, conversational text, markdown — each has different natural boundaries"},{"m":"Semantic chunking is always worth it","r":"It adds embedding cost at ingestion time and latency; for homogeneous text, recursive splitting is usually fine"},{"m":"Chunk size doesn't affect cost at query time","r":"Larger chunks consume more context window tokens when retrieved, increasing inference cost"}],"next":[{"name":"Embeddings","desc":"each chunk gets one embedding; chunk quality determines embedding quality"},{"name":"Vector & Hybrid Search","desc":"chunks are the unit being searched"},{"name":"Reranking","desc":"retrieves top-N chunks then reranks; bad chunks can't be rescued"},{"name":"Context Window Management","desc":"how many retrieved chunks fit in your prompt budget"}],"quiz":[{"q":"A relevant fact spans the last sentence of chunk 5 and first sentence of chunk 6. Which parameter would have prevented this?","options":["Larger chunk_size","chunk_overlap — shared tokens between adjacent chunks capture cross-boundary facts","Semantic chunking","Proposition chunking"],"correct":1,"explain":"chunk_overlap creates a sliding window between chunks. An overlap of 50–100 tokens ensures facts spanning chunk boundaries appear in at least one chunk completely."},{"q":"500-page legal contract, each clause 2–3 sentences. Fixed 512-token chunks or clause-boundary semantic chunks?","options":["Fixed 512-token chunks — simpler and well-tested","Clause-boundary semantic chunks — legal meaning lives in clauses, not arbitrary token windows","Both are equivalent for legal text","Use 128-token chunks for maximum precision"],"correct":1,"explain":"Legal meaning is clause-structured. Splitting mid-clause loses semantic integrity. Structural chunking at clause/article boundaries preserves the natural units of meaning."},{"q":"With parent-child chunking, you embed the child chunks. What do you return to the LLM when a child chunk matches?","options":["Only the matching child chunk","The parent chunk — providing broader context for the LLM to reason about","All sibling chunks","The entire document"],"correct":1,"explain":"Parent-child chunking separates retrieval precision (small child chunks) from context richness (large parent chunks). You embed small for accurate matching, then return the parent for full context."}]},{"id":12,"slug":"vector-hybrid-search","domainKey":"rag","title":"Vector & Hybrid Search","level":"Beginner","conceptMap":"Vector & Hybrid Search\n│\n├── Vector Search (semantic)\n│   ├── Embed query → float vector\n│   ├── ANN search in vector index\n│   ├── Returns: nearest neighbors by cosine/dot similarity\n│   └── Algorithms: HNSW (fast), IVF (scalable), ScaNN\n│\n├── Keyword Search (lexical)\n│   ├── BM25: term frequency × inverse document frequency\n│   ├── Exact and fuzzy term matching\n│   ├── Works without embeddings\n│   └── Strong on: product codes, names, rare terms, acronyms\n│\n├── Hybrid Search\n│   ├── Run both searches in parallel\n│   ├── Merge ranked lists via Reciprocal Rank Fusion (RRF)\n│   │   └── score = Σ 1/(k + rank_i) for each result list\n│   └── Typically outperforms either alone\n│\n├── Vector Databases\n│   ├── Pinecone (managed, serverless)\n│   ├── Weaviate (open-source, hybrid built-in)\n│   ├── Qdrant (open-source, Rust-based, fast)\n│   ├── Chroma (local/embedded, dev-friendly)\n│   └── pgvector (Postgres extension, familiar stack)\n│\n└── Connects To\n    ├── Embeddings (vectors come from embedding models)\n    ├── Chunking Strategies (what's being searched)\n    ├── Reranking (ANN retrieval feeds the reranker)\n    └── RAG vs Full Context (retrieval is the alternative to full context)","sections":[{"title":"Where This Fits","md":"After you've chunked and embedded your corpus, you need to find the right chunks at query time — fast, at scale. Vector search handles semantic similarity; keyword search handles exact term matching. Neither alone is enough; hybrid search combines their strengths."},{"title":"Core Mechanism","md":"### Vector search\n\n```python\nimport numpy as np\nfrom qdrant_client import QdrantClient\nfrom qdrant_client.models import Distance, VectorParams, PointStruct\n\nclient = QdrantClient(\":memory:\")  # in-memory for demo\n\n# Create collection\nclient.create_collection(\n    collection_name=\"docs\",\n    vectors_config=VectorParams(size=1536, distance=Distance.COSINE)\n)\n\n# Index chunks (done offline)\nclient.upsert(\n    collection_name=\"docs\",\n    points=[\n        PointStruct(id=i, vector=embed(chunk), payload={\"text\": chunk})\n        for i, chunk in enumerate(chunks)\n    ]\n)\n\n# Query at runtime\nquery_vec = embed(\"How do I cancel my subscription?\")\nresults = client.search(collection_name=\"docs\", query_vector=query_vec, limit=10)\n```\n\n### Keyword search (BM25)\n\n```python\nfrom rank_bm25 import BM25Okapi\n\n# Tokenized corpus\ntokenized = [chunk.split() for chunk in chunks]\nbm25 = BM25Okapi(tokenized)\n\n# Query\nquery_tokens = \"cancel subscription\".split()\nscores = bm25.get_scores(query_tokens)\ntop_indices = np.argsort(scores)[::-1][:10]\n```\n\n### Reciprocal Rank Fusion (RRF)\n\n```python\ndef rrf_merge(ranked_lists: list[list[int]], k: int = 60) -> list[int]:\n    \"\"\"\n    ranked_lists: each is an ordered list of chunk IDs\n    k: smoothing constant (60 is standard)\n    \"\"\"\n    scores: dict[int, float] = {}\n    for ranked in ranked_lists:\n        for rank, doc_id in enumerate(ranked):\n            scores[doc_id] = scores.get(doc_id, 0) + 1 / (k + rank + 1)\n    return sorted(scores, key=scores.get, reverse=True)\n\n# Merge vector results and BM25 results\nfinal_ranking = rrf_merge([vector_ids, bm25_ids])\ntop_10 = final_ranking[:10]\n```\n\n### When each search type wins\n\n| Query type | Vector | Keyword | Winner |\n|-----------|--------|---------|--------|\n| \"What's your refund policy?\" | ✓ synonyms | ~ | Vector |\n| \"Error code E4021\" | ✗ no embedding for rare code | ✓ exact match | Keyword |\n| \"CEO name\" | ~ | ✓ | Keyword |\n| \"How to improve performance?\" | ✓ | ~ many meanings | Vector |\n| Most queries | ✓ | ✓ | Hybrid |"},{"title":"Analogy","md":"Vector search is like asking a librarian who understands meaning — you say \"books about sadness\" and they find books on grief, depression, loss. Keyword search is like the card catalog — it finds exactly \"sadness\" but misses \"melancholy.\" Hybrid search is employing both: the librarian and the card catalog, then merging their recommendations."},{"title":"What This Means in Practice","md":"- **Default to hybrid** — pure vector search misses exact-match queries; pure keyword misses paraphrases\n- **pgvector is a solid starting point** — if you're already on Postgres, add `CREATE EXTENSION vector;` before spinning up a dedicated vector DB\n- **HNSW is the standard ANN algorithm** — nearly all vector DBs default to it; good recall/speed tradeoff\n- **ANN ≠ exact search** — approximate nearest neighbor means you may miss some true nearest neighbors; recall@K is ~95%+ for tuned HNSW, sufficient for RAG\n- **RRF k=60 is a robust default** — changing k rarely moves the needle much; focus on retrieval quality elsewhere\n- **Metadata filtering is essential** — vector DBs support pre-filtering by metadata (user_id, doc_type, date) before ANN search; use it to prevent cross-tenant leakage"}],"socratic":["A user queries \"SWIFT code for Payoneer.\" Your vector search ranks it 8th (weak embedding for financial codes). Your BM25 search ranks it 1st. After RRF with k=60, what's the approximate combined score of each? Which wins?","You're building a multi-tenant RAG system. Two tenants have documents with very similar content. What vector DB feature prevents Tenant A's query from retrieving Tenant B's documents?","Your retrieval pipeline has 200ms budget. ANN search takes 20ms. Reranking top-100 takes 150ms. What's the maximum number of candidates you can afford to send to the reranker?"],"socraticIntro":"","myths":[{"m":"Vector search understands meaning","r":"It finds statistically similar vectors; semantic understanding is limited by training data"},{"m":"BM25 is obsolete","r":"BM25 still beats vector search on exact-term queries; it's complementary, not deprecated"},{"m":"Hybrid search just averages scores","r":"You can't average scores across different scales; RRF works on ranks, not scores — that's why it works"},{"m":"More retrieved results = better answers","r":"Retrieving top-100 and dumping into context dilutes signal; retrieve more only if you rerank"},{"m":"Vector DB choice is critical to quality","r":"Chunking and embedding quality affect answer quality far more than which vector DB you pick"}],"next":[{"name":"Reranking","desc":"after ANN retrieval, how to improve precision with a second-pass scorer"},{"name":"Embeddings","desc":"the vectors that make this search possible"},{"name":"Chunking Strategies","desc":"what's being indexed and searched"},{"name":"Observability & Tracing","desc":"measuring retrieval quality in production"}],"quiz":[{"q":"User queries 'SWIFT code for Payoneer.' Vector search ranks it #8; BM25 ranks it #1. After RRF fusion, which wins?","options":["Vector search result wins — semantic similarity is more reliable","BM25 result wins — it had rank #1 which dominates RRF","Both score equally in RRF","The result with more characters wins"],"correct":1,"explain":"RRF score = 1/(k+rank). BM25's rank #1 → 1/(60+1) = 0.0164. Vector's rank #8 → 1/(60+8) = 0.0147. BM25 wins combined — exact term match on codes/names is critical."},{"q":"Multi-tenant RAG: two tenants have similar documents. What prevents Tenant A's query from returning Tenant B's documents?","options":["Vector similarity naturally separates tenants","Metadata filtering — filter by tenant_id before or during ANN search","The vector DB isolates tenants automatically","You must use separate vector databases per tenant"],"correct":1,"explain":"Vector similarity doesn't understand ownership — semantically similar documents from different tenants score similarly. Metadata filtering (tenant_id) enforces data isolation at the query level."},{"q":"Retrieval pipeline: 200ms budget. ANN search takes 20ms. Reranking top-100 takes 150ms. Can you fit reranking?","options":["No — 20ms + 150ms = 170ms, exceeds 200ms total budget too tightly","Yes — 20 + 150 = 170ms, within 200ms budget","No — reranking alone costs more than the budget","Only if you reduce to top-50 candidates"],"correct":1,"explain":"20ms (ANN) + 150ms (reranking) = 170ms — within the 200ms budget with 30ms to spare for network, post-processing, etc. Feasible but tight."}]},{"id":13,"slug":"reranking","domainKey":"rag","title":"Reranking","level":"Beginner","conceptMap":"Reranking\n│\n├── Why rerank?\n│   ├── ANN retrieval is fast but approximate\n│   ├── Bi-encoder (embedding) scores query & doc independently\n│   ├── Cross-encoder scores (query, doc) pair together → more accurate\n│   └── Trade latency for precision\n│\n├── Architecture: two-stage retrieval\n│   ├── Stage 1: ANN search → retrieve top-100 candidates (fast)\n│   └── Stage 2: Reranker scores all 100 → return top-10 (slower)\n│\n├── Reranker types\n│   ├── Cross-encoder: sees query + doc together, deep interaction\n│   ├── ColBERT: token-level late interaction (fast cross-encoder variant)\n│   └── LLM-based: ask LLM to score relevance (expensive, high quality)\n│\n├── Available rerankers\n│   ├── Cohere Rerank (API, easy)\n│   ├── Jina Reranker (API + open model)\n│   ├── BGE Reranker (open source, self-hosted)\n│   └── ColBERTv2 (open source, fast)\n│\n├── When to skip reranking\n│   ├── Latency budget \u003c 50ms total\n│   ├── Corpus is small and ANN precision is already high\n│   └── Cost is a hard constraint\n│\n└── Connects To\n    ├── Vector & Hybrid Search (stage 1 feeds reranker)\n    ├── Chunking Strategies (bad chunks can't be rescued by reranking)\n    ├── Embeddings (bi-encoder = embedding model)\n    └── Context Window Management (reranked top-K fills context)","sections":[{"title":"Where This Fits","md":"ANN vector search trades precision for speed — it finds approximately similar vectors, not exactly the most relevant documents. Reranking is the quality gate after retrieval: take the fast-but-rough top-100, apply a slow-but-accurate scorer, return the best 10. Most production RAG systems need both."},{"title":"Core Mechanism","md":"### Why bi-encoders alone are insufficient\n\n```\nBi-encoder (embedding model):\n  query → [embed] → vector_q\n  doc   → [embed] → vector_d\n  score = cosine(vector_q, vector_d)\n\n  ✓ Fast: embed query once, search index\n  ✗ Limited: query and doc never \"see\" each other during scoring\n```\n\n```\nCross-encoder:\n  [query + doc] → [model] → relevance_score\n\n  ✓ Accurate: full attention between query and doc tokens\n  ✗ Slow: must run inference for each (query, doc) pair\n```\n\n### Using Cohere Rerank (simplest path)\n\n```python\nimport cohere\n\nco = cohere.Client(\"your-api-key\")\n\n# Stage 1: retrieve 100 candidates from vector/hybrid search\ncandidates = vector_search(query, top_k=100)\ncandidate_texts = [c[\"text\"] for c in candidates]\n\n# Stage 2: rerank\nresponse = co.rerank(\n    model=\"rerank-english-v3.0\",\n    query=query,\n    documents=candidate_texts,\n    top_n=10  # return top 10\n)\n\nreranked = [candidates[r.index] for r in response.results]\n```\n\n### Open-source reranking (self-hosted)\n\n```python\nfrom sentence_transformers import CrossEncoder\n\nmodel = CrossEncoder(\"cross-encoder/ms-marco-MiniLM-L-6-v2\")\n\n# Score all (query, doc) pairs\npairs = [(query, doc) for doc in candidate_texts]\nscores = model.predict(pairs)  # float array\n\n# Sort by score\nranked = sorted(zip(scores, candidates), reverse=True)\ntop_10 = [c for _, c in ranked[:10]]\n```\n\n### Quality improvement example\n\n```\nQuery: \"how to handle rate limit errors\"\n\nANN top-5 (by cosine similarity):\n  1. \"API error handling overview\"          sim=0.82\n  2. \"HTTP status codes reference\"          sim=0.81\n  3. \"Rate limit errors: retry with backoff\" sim=0.79  ← most relevant\n  4. \"Authentication errors\"               sim=0.78\n  5. \"Error logging best practices\"        sim=0.77\n\nAfter reranking top-5:\n  1. \"Rate limit errors: retry with backoff\" score=0.95 ← promoted to #1\n  2. \"API error handling overview\"          score=0.71\n  3. \"HTTP status codes reference\"          score=0.48\n  ...\n```"},{"title":"Analogy","md":"Think of ANN retrieval as a fast keyword search that returns 100 candidates in 20ms. The reranker is the expert reviewer who reads all 100 and ranks them by actual relevance in 150ms. The fast search casts a wide net; the reranker finds the fish worth keeping."},{"title":"What This Means in Practice","md":"- **Retrieve more, rerank down** — retrieve top-50 to 200 candidates; rerank to top-5 to 20; reranker quality degrades if it sees too few candidates\n- **Latency math** — reranking 100 docs with Cohere adds ~100–200ms; factor into your SLA\n- **Reranker pays for itself** — even a 10% improvement in retrieval precision meaningfully improves answer quality; worth the latency for most use cases\n- **ColBERT is the speed/quality sweet spot** — faster than standard cross-encoder, more accurate than bi-encoder; good for latency-sensitive apps\n- **LLM-as-reranker** — ask the LLM \"rank these 10 passages by relevance to the query\" — highest quality but 1–2s latency and high cost; only for offline/batch use cases"}],"socratic":["Your RAG latency budget is 500ms. LLM inference takes 300ms. ANN search takes 30ms. You want to rerank top-50 docs. Cohere Rerank takes ~2ms per doc. Can you fit reranking in budget? What's the maximum candidates you can rerank?","A user asks about \"churn reduction strategies.\" Your bi-encoder ranks \"customer retention playbook\" as #3 and \"product cancellation flow\" as #1. After reranking, which would you expect to rank higher and why?","You're building a RAG system where queries are always very similar to document titles (e.g. FAQ system). Do you need reranking? Why or why not?"],"socraticIntro":"","myths":[{"m":"Reranking replaces vector search","r":"No — cross-encoders are too slow to score millions of docs; ANN retrieval is still stage 1"},{"m":"Reranking fixes bad chunking","r":"No — if the relevant information isn't in any retrieved chunk, reranking can't conjure it"},{"m":"Higher cosine similarity = more relevant","r":"Not always — bi-encoder scores are proxy metrics; cross-encoder relevance scores are more reliable"},{"m":"I should rerank all retrieved docs","r":"Only rerank what ANN retrieval returns; you don't have the latency budget to rerank the whole corpus"},{"m":"Reranking is only for RAG","r":"Also used in search engines, recommendation systems, any ranked retrieval task"}],"next":[{"name":"Vector & Hybrid Search","desc":"the stage-1 retrieval that feeds the reranker"},{"name":"Observability & Tracing","desc":"measure retrieval quality (precision@K) before and after reranking"},{"name":"RAG vs Full Context","desc":"when retrieval quality is so critical that you reconsider the architecture"},{"name":"Embeddings","desc":"bi-encoder = embedding model; understanding one deepens the other"}],"quiz":[{"q":"Latency budget: 500ms total. LLM inference: 300ms. ANN search: 30ms. Reranking top-50 at ~2ms/doc. Can you fit reranking?","options":["No — 300+30+100 = 430ms is too close to budget","Yes — 300+30+(50×2ms) = 430ms, within 500ms","No — reranking cost is too high","Only if you use ColBERT instead of a cross-encoder"],"correct":1,"explain":"300ms (LLM) + 30ms (ANN) + 100ms (50 docs × 2ms) = 430ms — within 500ms budget. Yes, reranking fits."},{"q":"User asks about 'churn reduction strategies.' Bi-encoder ranks 'product cancellation flow' #1. After reranking, which ranks higher?","options":["'Product cancellation flow' — it's more specific","'Customer retention playbook' — cross-encoder understands the query intent better","They rank equally after reranking","Reranking doesn't change the top result"],"correct":1,"explain":"Cross-encoders jointly reason about query and document together. 'Customer retention playbook' directly matches 'churn reduction strategies' semantically — the cross-encoder catches this better than the bi-encoder."},{"q":"When do you NOT need reranking?","options":["When your corpus has more than 1M documents","When your FAQ queries always closely match document titles — ANN precision is already high","Reranking is always necessary","When using hybrid search"],"correct":1,"explain":"If your retrieval is already high-precision (e.g., FAQ where queries directly match titles), adding reranking adds latency and cost with minimal quality gain."}]},{"id":14,"slug":"rag-vs-full-context","domainKey":"rag","title":"RAG vs Full Context","level":"Beginner","conceptMap":"RAG vs Full Context\n│\n├── Full Context approach\n│   ├── Stuff entire corpus into context window\n│   ├── Pros: simpler, no retrieval pipeline, coherent reasoning\n│   └── Cons: expensive, slow, hits limits, attention dilution\n│\n├── RAG approach\n│   ├── Retrieve only relevant chunks at query time\n│   ├── Pros: scales to any corpus, cheaper, fresher data\n│   └── Cons: retrieval quality ceiling, pipeline complexity, latency\n│\n├── Decision factors\n│   ├── Corpus size: fits in context? → consider full context\n│   ├── Update frequency: changes daily? → RAG (re-embed, not re-prompt)\n│   ├── Latency budget: \u003c200ms? → full context if it fits\n│   ├── Cost: high volume? → RAG (don't send 100k tokens every call)\n│   └── Answer quality: RAG only as good as retrieval\n│\n├── Failure modes\n│   ├── Full context: lost-in-the-middle, cost explosion\n│   ├── RAG: retrieval misses → wrong answer with false confidence\n│   └── Neither: when knowledge requires training (fine-tuning instead)\n│\n└── Connects To\n    ├── Embeddings (RAG requires them)\n    ├── Context Windows (full context hits this limit)\n    ├── Chunking Strategies (RAG retrieval unit)\n    └── Cost & Latency Optimization (main tradeoff axis)","sections":[{"title":"Where This Fits","md":"Once you've decided to augment an LLM with external knowledge, the first architecture decision is: do you retrieve relevant pieces (RAG) or just put everything in the prompt? This choice has enormous consequences for cost, latency, accuracy, and system complexity."},{"title":"Core Mechanism","md":"### Full context approach\n\n```python\n# Load entire knowledge base into prompt\nwith open(\"knowledge_base.txt\") as f:\n    knowledge = f.read()  # could be 50k–500k tokens\n\nresponse = client.messages.create(\n    model=\"claude-sonnet-4-5\",\n    max_tokens=1024,\n    messages=[{\n        \"role\": \"user\",\n        \"content\": f\"\"\"Answer based on this knowledge base:\n\n\u003cknowledge>\n{knowledge}\n\u003c/knowledge>\n\nQuestion: {user_query}\"\"\"\n    }]\n)\n```\n\n**Cost of full context:** 500k tokens × $3/1M = $1.50 per query. At 1000 queries/day = $1,500/day.\n\n### RAG approach\n\n```python\n# Retrieve only what's relevant\nrelevant_chunks = retrieve(user_query, top_k=5)  # ~2500 tokens\ncontext = \"\\n\\n\".join(c[\"text\"] for c in relevant_chunks)\n\nresponse = client.messages.create(\n    model=\"claude-sonnet-4-5\",\n    max_tokens=1024,\n    messages=[{\n        \"role\": \"user\",\n        \"content\": f\"\"\"Answer based on these relevant passages:\n\n\u003ccontext>\n{context}\n\u003c/context>\n\nQuestion: {user_query}\"\"\"\n    }]\n)\n```\n\n**Cost of RAG:** 2500 tokens × $3/1M = $0.0075 per query. At 1000 queries/day = $7.50/day. 200× cheaper.\n\n### The lost-in-the-middle problem (full context failure)\n\nResearch shows LLMs are better at using information at the beginning and end of long contexts. Information buried in the middle of a 100k-token context is often ignored or misused.\n\n```\nContext: [doc1 doc2 ... doc50 ... doc100]\n                         ↑\n                 Model often ignores this area\n```\n\n### When retrieval fails (RAG failure)\n\n```\nUser: \"What's our policy on returns after 90 days?\"\n\nRetrieval top-3:\n  - \"Returns within 30 days: full refund\"\n  - \"Returns within 60 days: store credit\"\n  - \"International shipping policy\"\n\n← The 90-day policy exists but wasn't retrieved\n\nModel: \"Based on our policy, returns are accepted within 60 days...\"\n        [Wrong — but confident. Retrieval miss = silent failure]\n```\n\n### Decision framework\n\n```\nIs corpus \u003c 50k tokens AND rarely changes?\n  └─ Yes → Full context (simpler, coherent)\n  └─ No →\n      Is corpus \u003c 200k tokens AND latency \u003c 1s AND cost not critical?\n        └─ Yes → Consider full context with Claude's 200k window\n        └─ No → Use RAG\n            Does retrieval quality need to be near-perfect?\n              └─ Yes → Add reranker + retrieval evals\n              └─ No → Basic vector search may suffice\n```"},{"title":"Analogy","md":"Full context is giving someone the entire encyclopedia to answer one question — they'll find it, but you paid for a lot of pages they ignored. RAG is giving them a librarian who fetches just the relevant pages. The librarian is usually better and cheaper, but if the librarian grabs the wrong pages, you get a confident wrong answer."},{"title":"What This Means in Practice","md":"- **Small, static corpora (\u003c20k tokens)**: full context wins — simpler, no retrieval pipeline, better coherence\n- **Large or frequently updated corpora**: RAG wins — re-embed changed docs, don't change your prompt\n- **Hybrid**: retrieve top chunks + always include a small \"core facts\" section in every prompt (company name, current date, key policies)\n- **RAG confidence calibration**: when retrieval misses, model often hallucinates rather than saying \"I don't know\" — add an explicit instruction: \"If the context doesn't contain the answer, say so\"\n- **Measure retrieval quality separately**: track retrieval precision@5 and recall@5 independent of answer quality — retrieval is where most RAG systems fail"}],"socratic":["Your knowledge base is a 10,000-token product FAQ that never changes. Which approach would you choose and why?","Your RAG system gives confident wrong answers on 15% of queries. Your retrieval precision@5 is 0.65. What's the most likely root cause and what should you fix first?","You're building a customer support bot over 50,000 support tickets that grow by 500/day. Why would full context become impractical within a month even if you have the token budget?"],"socraticIntro":"","myths":[{"m":"RAG is always better than full context","r":"For small static corpora, full context is simpler and often more accurate"},{"m":"Full context is impractical at 200k tokens","r":"Claude handles 200k; for many use cases this covers the full corpus cheaply"},{"m":"RAG hallucination is a model problem","r":"Usually a retrieval miss — the model is answering based on incomplete context, not fabricating"},{"m":"Fine-tuning can replace RAG","r":"Fine-tuning bakes knowledge into weights, hard to update; RAG externalizes knowledge, easy to update"},{"m":"More context always helps","r":"Past a point, context dilution hurts — less focused = lower quality answers"}],"next":[{"name":"Chunking Strategies","desc":"chunking quality determines RAG ceiling"},{"name":"Vector & Hybrid Search","desc":"retrieval mechanism behind RAG"},{"name":"Reranking","desc":"improving retrieval precision to reduce RAG failures"},{"name":"Cost & Latency Optimization","desc":"the primary axis that drives RAG vs full context choice"}],"quiz":[{"q":"Your knowledge base is a 10,000-token product FAQ that never changes. Which approach?","options":["RAG — always better for production","Full context — it fits easily, no retrieval complexity needed, and doesn't change","RAG — for freshness","Either; the choice doesn't matter at this scale"],"correct":1,"explain":"10k tokens fits well within context windows. RAG's main benefits (scale, freshness) don't apply here. Full context is simpler, more reliable, and avoids retrieval failure modes."},{"q":"Your RAG system gives confident wrong answers on 15% of queries. Retrieval precision@5 is 0.65. What do you fix first?","options":["Improve the LLM's system prompt","Fix retrieval — 35% of top-5 results are irrelevant; the model confidently answers from wrong docs","Add more documents to the corpus","Use a frontier model instead"],"correct":1,"explain":"Retrieval precision@5 = 0.65 means 35% of retrieved chunks are irrelevant. The model confidently answers from these wrong docs. Fix retrieval quality first — prompt improvements won't help when the model is working from wrong information."},{"q":"50,000 support tickets growing by 500/day. Why would full context become impractical quickly?","options":["The model can't handle customer support data","50k tickets × avg 500 tokens = 25M tokens — far exceeds any context window, and grows daily","Full context works fine until 1M tickets","Only impractical if tickets are in multiple languages"],"correct":1,"explain":"50k tickets × ~500 tokens = 25M tokens — 100x beyond even the largest context windows. And it grows by 250k tokens/day. RAG is the only viable architecture at this scale."}]},{"id":15,"slug":"function-calling","domainKey":"tools","title":"Function Calling","level":"Beginner","conceptMap":"Function Calling\n│\n├── What It Is\n│   ├── Model outputs structured tool invocations (not text)\n│   ├── You define tools as JSON schema\n│   └── Model decides when/which tool to call\n│\n├── The Loop\n│   ├── 1. Define tools → send with prompt\n│   ├── 2. Model returns tool_use block (name + inputs)\n│   ├── 3. You execute the function\n│   ├── 4. Return result as tool_result message\n│   └── 5. Model reads result → continues / calls more tools\n│\n├── Variations\n│   ├── Parallel tool calls (multiple tools at once)\n│   ├── Forced tool use (require specific tool)\n│   ├── Sequential chaining (output feeds next call)\n│   └── No-tool fallback (model answers without calling)\n│\n├── Error Handling\n│   ├── Tool execution fails → return structured error\n│   ├── Model retries or adjusts approach\n│   └── is_error flag in tool_result\n│\n└── Connects To\n    ├── Tool Interface Design (how to define tools well)\n    ├── Agent Loop & Harness (function calling IS the agent mechanism)\n    ├── Multi-Agent Systems (tools can call other agents)\n    └── Security & Permission Scoping (tools have real-world effects)","sections":[{"title":"Where This Fits","md":"Function calling is the mechanism that turns a text model into an agent — instead of returning prose, the model returns a structured intent to act, and your code executes it. Almost every agentic system is built on this primitive."},{"title":"Core Mechanism","md":"The model doesn't \"call\" functions directly. It outputs a structured object saying \"I want to call this function with these arguments.\" You run the function, return the result, and the model continues.\n\n### Full cycle example (Anthropic SDK)\n\n```python\nimport anthropic\n\nclient = anthropic.Anthropic()\n\n# 1. Define tools\ntools = [\n    {\n        \"name\": \"get_weather\",\n        \"description\": \"Get current weather for a city. Use when user asks about weather conditions.\",\n        \"input_schema\": {\n            \"type\": \"object\",\n            \"properties\": {\n                \"city\": {\"type\": \"string\", \"description\": \"City name, e.g. 'London'\"},\n                \"unit\": {\"type\": \"string\", \"enum\": [\"celsius\", \"fahrenheit\"]}\n            },\n            \"required\": [\"city\"]\n        }\n    }\n]\n\n# 2. Send message with tools\nresponse = client.messages.create(\n    model=\"claude-sonnet-4-5\",\n    max_tokens=1024,\n    tools=tools,\n    messages=[{\"role\": \"user\", \"content\": \"What's the weather in Tokyo?\"}]\n)\n\n# 3. Check if model wants to call a tool\nif response.stop_reason == \"tool_use\":\n    tool_use = next(b for b in response.content if b.type == \"tool_use\")\n    print(tool_use.name)    # \"get_weather\"\n    print(tool_use.input)   # {\"city\": \"Tokyo\", \"unit\": \"celsius\"}\n\n    # 4. Execute the function (your code)\n    result = get_weather(tool_use.input[\"city\"])  # {\"temp\": 22, \"condition\": \"cloudy\"}\n\n    # 5. Return result and continue\n    response2 = client.messages.create(\n        model=\"claude-sonnet-4-5\",\n        max_tokens=1024,\n        tools=tools,\n        messages=[\n            {\"role\": \"user\", \"content\": \"What's the weather in Tokyo?\"},\n            {\"role\": \"assistant\", \"content\": response.content},\n            {\n                \"role\": \"user\",\n                \"content\": [{\n                    \"type\": \"tool_result\",\n                    \"tool_use_id\": tool_use.id,\n                    \"content\": str(result)\n                }]\n            }\n        ]\n    )\n    print(response2.content[0].text)\n    # \"The weather in Tokyo is currently 22°C and cloudy.\"\n```\n\n### Parallel tool calls\n\n```python\n# Model can call multiple tools at once — handle all before continuing\nif response.stop_reason == \"tool_use\":\n    tool_uses = [b for b in response.content if b.type == \"tool_use\"]\n    \n    tool_results = []\n    for tool_use in tool_uses:\n        result = dispatch_tool(tool_use.name, tool_use.input)\n        tool_results.append({\n            \"type\": \"tool_result\",\n            \"tool_use_id\": tool_use.id,\n            \"content\": result\n        })\n    # Return ALL results in one message\n```\n\n### Error handling\n\n```python\n# When a tool fails, tell the model — it can retry or recover\ntool_results.append({\n    \"type\": \"tool_result\",\n    \"tool_use_id\": tool_use.id,\n    \"content\": \"Error: City 'Tokiyo' not found. Did you mean 'Tokyo'?\",\n    \"is_error\": True\n})\n```"},{"title":"Analogy","md":"Function calling is like a surgeon asking a scrub nurse for instruments. The surgeon (model) says \"scalpel\" — the nurse (your code) hands it over. The surgeon doesn't reach into the tray directly. They state intent; you execute; they continue."},{"title":"What This Means in Practice","md":"- **The model doesn't execute code** — it outputs structured intent, you run it. Never forget this boundary.\n- **Tool results shape model behavior** — bad/missing results lead to bad answers. Garbage in, garbage out.\n- **Parallel calls save latency** — if a model calls 3 tools sequentially that could run in parallel, you're leaving time on the table. Detect and parallelize.\n- **Forced tool use** — `tool_choice={\"type\": \"tool\", \"name\": \"extract_data\"}` forces a specific tool. Useful for structured extraction pipelines.\n- **Loops need stopping conditions** — a model can keep calling tools indefinitely. Your harness needs max_iterations or a \"done\" signal."}],"socratic":["A model calls `send_email` but your SMTP server is down. How do you handle this so the model can recover gracefully?","You have 5 tools defined but want the model to always use `validate_input` first. How do you enforce this?","A user asks \"Compare weather in London, Paris, and Tokyo.\" How should the model optimally use function calling here?"],"socraticIntro":"","myths":[{"m":"The model runs the function","r":"Model outputs intent only; your code executes it"},{"m":"Function calling = code execution","r":"Function calling is structured output. Code execution is a separate concern"},{"m":"One tool call per response","r":"Model can call multiple tools in parallel in one response"},{"m":"Tool results are automatic","r":"You must manually inject results back as `tool_result` messages"},{"m":"Any function can be a tool","r":"Tools with ambiguous descriptions or complex params confuse the model"}],"next":[{"name":"Tool Interface Design","desc":"how to write tool definitions the model uses reliably"},{"name":"Agent Loop & Harness","desc":"function calling is the core of agentic loops"},{"name":"Multi-Agent Systems","desc":"tools can invoke other agents"},{"name":"Permission Scoping","desc":"tools have real-world effects; scope them carefully"}],"quiz":[{"q":"Model calls send_email but your SMTP server is down. How do you handle it for model recovery?","options":["Raise an exception and crash the agent","Return a structured error in tool_result with is_error=True — model can retry or adjust","Silently ignore and return empty result","Retry the SMTP call 10 times before returning"],"correct":1,"explain":"Return a structured error message in tool_result with is_error=True. The model reads this and can decide to retry, ask the user, or take an alternative approach."},{"q":"User asks 'Compare weather in London, Paris, and Tokyo.' How should the model optimally use function calling?","options":["Make 3 sequential calls, one per city","Make 3 parallel tool calls — all are independent and can run concurrently","Make 1 call with a list parameter containing all 3 cities","Ask the user to specify one city at a time"],"correct":1,"explain":"Parallel tool calls run multiple independent tool invocations in one model turn. Weather for each city is independent — no reason to serialize. This reduces latency 3x."},{"q":"You want the model to always call validate_input before any other tool. How do you enforce this?","options":["The model automatically calls tools in definition order","Use forced tool use to require validate_input, then allow others in subsequent turns","Write it in the system prompt","You can't enforce tool call order"],"correct":1,"explain":"Forced tool use (tool_choice param) requires the model to use a specific tool. Force validate_input first, then allow the model to use any tool in subsequent turns of the loop."}]},{"id":16,"slug":"tool-interface-design","domainKey":"tools","title":"Tool Interface Design","level":"Beginner","conceptMap":"Tool Interface Design\n│\n├── Naming\n│   ├── verb-noun format: get_weather, search_documents, send_email\n│   ├── Unambiguous: what it does, obvious from name\n│   └── No overlap: tools shouldn't have similar names/purposes\n│\n├── Description Quality\n│   ├── When TO call (trigger conditions)\n│   ├── When NOT TO call (explicit exclusions)\n│   ├── What it returns (output format)\n│   └── Model uses description to decide — bad description = bad calls\n│\n├── Parameter Design\n│   ├── Simple types (string, number, boolean, enum)\n│   ├── Enums over free strings (constrain model choices)\n│   ├── Required vs optional (mark clearly)\n│   ├── Descriptive param names + descriptions\n│   └── Avoid ambiguous/overlapping params\n│\n├── Granularity\n│   ├── One action per tool (not mega-tools)\n│   ├── Composable: model chains small tools vs one big one\n│   └── Too many tools → model confused which to pick\n│\n├── Error Responses\n│   ├── Structured errors model can understand\n│   ├── Actionable: \"City not found, try 'Tokyo' not 'Tokio'\"\n│   └── Avoid stack traces — return human-readable context\n│\n└── Connects To\n    ├── Function Calling (where design gets applied)\n    ├── Agent Loop & Harness (tool quality = agent quality)\n    └── Permission Scoping (design gates access)","sections":[{"title":"Where This Fits","md":"The model's ability to use tools effectively depends almost entirely on how you define them — a well-designed tool gets called correctly; a poorly-designed one gets ignored, misused, or called with wrong arguments. Tool interface design is the API design problem of AI engineering."},{"title":"Core Mechanism","md":"### Bad vs Good: same tool, two definitions\n\n**Bad — vague, no guidance:**\n```python\n{\n    \"name\": \"search\",\n    \"description\": \"Search for things\",\n    \"input_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n            \"query\": {\"type\": \"string\"},\n            \"type\": {\"type\": \"string\"}   # What values are valid? Model guesses.\n        }\n    }\n}\n```\n\n**Good — precise, constrained:**\n```python\n{\n    \"name\": \"search_products\",\n    \"description\": (\n        \"Search the product catalog by keyword. Use when the user asks about \"\n        \"specific products, prices, or availability. Do NOT use for order status \"\n        \"or customer account questions — use get_order_status for those.\"\n    ),\n    \"input_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\n            \"query\": {\n                \"type\": \"string\",\n                \"description\": \"Search keywords, e.g. 'blue running shoes size 10'\"\n            },\n            \"category\": {\n                \"type\": \"string\",\n                \"enum\": [\"shoes\", \"clothing\", \"accessories\", \"all\"],\n                \"description\": \"Product category to filter by. Use 'all' if unsure.\"\n            },\n            \"max_results\": {\n                \"type\": \"integer\",\n                \"description\": \"Number of results to return. Default 5, max 20.\"\n            }\n        },\n        \"required\": [\"query\"]\n    }\n}\n```\n\n### Granularity: one action per tool\n\n```python\n# BAD — mega-tool, too broad\n{\n    \"name\": \"manage_user\",\n    \"description\": \"Create, update, delete, or get a user\",\n    \"input_schema\": {\n        \"properties\": {\n            \"action\": {\"type\": \"string\"},  # \"create\"/\"update\"/\"delete\"/\"get\"\n            \"user_id\": {\"type\": \"string\"},\n            \"data\": {\"type\": \"object\"}     # Wildly different shape per action\n        }\n    }\n}\n\n# GOOD — separate tools, each focused\n# get_user(user_id) \n# create_user(name, email, role)\n# update_user(user_id, fields_to_update)\n# delete_user(user_id, reason)\n```\n\n### Error responses the model can act on\n\n```python\ndef get_user(user_id: str) -> dict:\n    user = db.find(user_id)\n    if not user:\n        # BAD: raise Exception(\"User not found\")  ← model gets stack trace\n        # GOOD:\n        return {\n            \"error\": \"user_not_found\",\n            \"message\": f\"No user with id '{user_id}'. Use search_users to find the correct id.\",\n            \"suggestion\": \"Try search_users(query='john doe') to locate the user first.\"\n        }\n    return user.to_dict()\n```\n\n### Too many tools: confusion threshold\n\n```python\n# Studies suggest model accuracy drops with >10-15 tools\n# If you have 30+ tools, use tool routing:\n# 1. First call: model picks a category\n# 2. Second call: model picks specific tool from that category\n# Or: dynamically inject only relevant tools per request\n```"},{"title":"Analogy","md":"Designing tools for a model is like writing API documentation for a junior developer who can't ask follow-up questions. Every ambiguity in your docs becomes a bug at runtime. The model reads your description once and acts on it — precision is everything."},{"title":"What This Means in Practice","md":"- **Description is the contract** — spend more time on description than on parameter names. The model reads descriptions to decide when and how to call.\n- **Enums prevent hallucination** — `\"enum\": [\"asc\", \"desc\"]` means the model can't invent `\"ascending\"`. Free string params invite creative misuse.\n- **Negative instructions matter** — \"Do NOT use this for X\" actively prevents wrong-tool selection in ambiguous cases.\n- **Test with weird inputs** — prompt the model with edge cases. See if it calls the right tool, wrong tool, or no tool. Fix the description.\n- **Return types matter too** — document what the tool returns; the model uses this to form its final answer."}],"socratic":["You have a tool `manage_calendar` that handles create/read/update/delete events. What's wrong with this design and how would you fix it?","A model keeps calling `search_orders` when users ask about product availability. What's the likely root cause, and where do you fix it?","Your tool returns raw database rows with 40 fields when called. Why is this a problem even if the data is correct?"],"socraticIntro":"","myths":[{"m":"Model figures out how to use tools from the name alone","r":"Description quality directly determines call accuracy"},{"m":"More tools = more capable agent","r":"Too many tools confuses the model; prune aggressively"},{"m":"Parameters should be flexible (accept anything)","r":"Flexible params = model invents values. Constrain with enums and clear types"},{"m":"Error handling is the caller's job","r":"Tools should return structured, actionable errors the model can reason about"},{"m":"One big tool is simpler to maintain","r":"One big tool hides intent; model can't selectively use capabilities"}],"next":[{"name":"Function Calling","desc":"where tool definitions get applied in the API"},{"name":"Model Context Protocol","desc":"tool design principles at protocol scale"},{"name":"Agent Loop & Harness","desc":"how tool quality propagates to agent quality"},{"name":"Evals","desc":"testing tool selection accuracy with model-graded or code-graded evals"}],"quiz":[{"q":"You have a tool manage_calendar that handles create/read/update/delete events. What's wrong?","options":["Calendar tools shouldn't be exposed to models","One mega-tool for 4 different actions — split into create_event, get_event, update_event, delete_event","The name is too long","Calendar events need a special schema type"],"correct":1,"explain":"One-action-per-tool principle. A mega-tool forces the model to include a 'action' parameter, adds ambiguity, and makes it harder for the model to pick the right behavior."},{"q":"Model keeps calling search_orders when users ask about product availability. Likely root cause?","options":["The model is hallucinating","Tool description doesn't clearly say when NOT to use it — or no dedicated product_availability tool exists","Temperature is too high","The user prompt is ambiguous"],"correct":1,"explain":"Tool misuse is almost always a description problem. Either the description doesn't exclude availability queries, or there's no better tool, so the model guesses. Fix the description or add a dedicated tool."},{"q":"Your tool returns raw database rows with 40 fields per result. Problem?","options":["Too much data costs more in API calls","The model wastes attention on 38 irrelevant fields — answer quality degrades and cost rises","Database rows can't be returned as tool results","No problem — more data helps the model"],"correct":1,"explain":"Return only what the model needs. 40 fields dilutes model attention on the 2–3 relevant ones, wastes context window tokens, and increases cost. Curate tool output to match the task."}]},{"id":17,"slug":"model-context-protocol","domainKey":"tools","title":"Model Context Protocol (MCP)","level":"Beginner","conceptMap":"Model Context Protocol (MCP)\n│\n├── What It Is\n│   ├── Standardized JSON-RPC protocol\n│   ├── Connects LLM clients to external systems\n│   └── One server → any compatible client (Claude, VS Code, etc.)\n│\n├── Three Primitives\n│   ├── Tools — model can invoke (side effects, actions)\n│   ├── Resources — data model can read (files, DB records, APIs)\n│   └── Prompts — pre-built prompt templates with arguments\n│\n├── Architecture\n│   ├── MCP Client (Claude Desktop, IDE, your app)\n│   │   └── Sends requests to server over stdio or HTTP/SSE\n│   ├── MCP Server (your code)\n│   │   ├── Exposes tools/resources/prompts\n│   │   └── Standalone process or embedded\n│   └── Transport: stdio (local), HTTP+SSE (remote)\n│\n├── When to Use MCP vs Custom Tools\n│   ├── MCP: reusable across clients, standardized discovery\n│   └── Custom tools: app-specific, simpler for single use case\n│\n└── Connects To\n    ├── Function Calling (tools are function-calling at protocol level)\n    ├── Tool Interface Design (same principles apply to MCP tools)\n    ├── Agent Loop & Harness (MCP servers extend agent capabilities)\n    └── Security & Permission Scoping (MCP servers need access control)","sections":[{"title":"Where This Fits","md":"Custom function calling requires defining tools per-app, per-model, per-SDK. MCP standardizes this: build one server that exposes tools/data, and any MCP-compatible client (Claude Desktop, VS Code Copilot, your custom agent) can use it without rewiring. It's the USB-C of AI integrations."},{"title":"Core Mechanism","md":"### The protocol flow\n\n```\nUser prompt → MCP Client → [discover tools from server]\n                         → [model picks tool, sends call]\n                         → MCP Server executes tool\n                         → Returns result to client\n                         → Model generates final response\n```\n\n### Building a simple MCP server (Python)\n\n```python\n# pip install mcp\nfrom mcp.server import Server\nfrom mcp.server.stdio import stdio_server\nfrom mcp.types import Tool, TextContent\nimport mcp.types as types\n\napp = Server(\"my-database-server\")\n\n# Expose a Tool\n@app.list_tools()\nasync def list_tools() -> list[Tool]:\n    return [\n        Tool(\n            name=\"query_customers\",\n            description=\"Query customer records by email or ID. Returns name, plan, and signup date.\",\n            inputSchema={\n                \"type\": \"object\",\n                \"properties\": {\n                    \"identifier\": {\n
