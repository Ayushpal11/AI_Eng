                       \"type\": \"string\",\n                        \"description\": \"Customer email or ID\"\n                    }\n                },\n                \"required\": [\"identifier\"]\n            }\n        )\n    ]\n\n@app.call_tool()\nasync def call_tool(name: str, arguments: dict) -> list[TextContent]:\n    if name == \"query_customers\":\n        customer = db.find(arguments[\"identifier\"])\n        if not customer:\n            return [TextContent(type=\"text\", text=\"Customer not found\")]\n        return [TextContent(type=\"text\", text=str(customer.to_dict()))]\n\n# Expose a Resource (data the model can read)\n@app.list_resources()\nasync def list_resources():\n    return [\n        types.Resource(\n            uri=\"db://customers/schema\",\n            name=\"Customer Schema\",\n            description=\"Database schema for the customers table\",\n            mimeType=\"text/plain\"\n        )\n    ]\n\n@app.read_resource()\nasync def read_resource(uri: str):\n    if uri == \"db://customers/schema\":\n        return \"id, email, name, plan, created_at, status\"\n\n# Run server over stdio\nasync def main():\n    async with stdio_server() as streams:\n        await app.run(*streams, app.create_initialization_options())\n```\n\n### Connecting to Claude Desktop\n\n```json\n// ~/.claude/claude_desktop_config.json\n{\n  \"mcpServers\": {\n    \"my-database\": {\n      \"command\": \"python\",\n      \"args\": [\"/path/to/your/server.py\"]\n    }\n  }\n}\n```\n\nNow Claude Desktop auto-discovers your tools. Same server works in VS Code, Cursor, or any MCP client.\n\n### Three primitives compared\n\n| Primitive | Direction | Has Side Effects | Example |\n|-----------|-----------|-----------------|---------|\n| Tools | Client → Server (invoke) | Yes | `send_email`, `query_db` |\n| Resources | Client → Server (read) | No | schema docs, file contents |\n| Prompts | Client → Server (get template) | No | `/summarize-ticket` template |"},{"title":"Analogy","md":"MCP is the HDMI standard for AI tools. Before HDMI, every device used different connectors — you needed adapters everywhere. MCP means: build your \"screen\" (data source) once with an MCP server, and any \"device\" (AI client) plugs in without custom adapters."},{"title":"What This Means in Practice","md":"- **Build once, use everywhere** — one MCP server for your internal DB works in Claude Desktop, VS Code Copilot, and your custom agent without code changes.\n- **Separation of concerns** — tool implementation lives in the MCP server, not in your agent code. Easier to update, test, and version.\n- **Discovery is automatic** — clients call `list_tools` on connect; no manual tool registration per agent.\n- **stdio for local, HTTP/SSE for remote** — local tools run as a subprocess over stdin/stdout. Remote tools (shared across users) need HTTP transport with auth.\n- **MCP ≠ always the right choice** — for a single-app tool used in one place, custom function calling is simpler. Use MCP when you want reusability across clients or teams."}],"socratic":["You're building an internal tool that lets Claude query your company's Jira. Should you build an MCP server or use custom function calling in your agent? What factors decide?","What's the difference between a Tool and a Resource in MCP? Give a concrete example where you'd use a Resource instead of a Tool.","Your MCP server exposes customer data. A colleague builds a separate app that also uses your server. What security concern does this raise and how do you address it?"],"socraticIntro":"","myths":[{"m":"MCP replaces function calling","r":"MCP is built ON function calling — it standardizes the discovery and transport layer"},{"m":"MCP tools run inside the model","r":"MCP server is a separate process; model just sees tool definitions and results"},{"m":"Resources are like RAG","r":"Resources are explicit files/data the model reads on demand, not retrieved by similarity"},{"m":"MCP is only for Claude","r":"MCP is an open protocol; supported by VS Code, Cursor, and growing ecosystem"},{"m":"You need MCP for every AI tool","r":"For app-specific, single-client tools, custom function calling is simpler"}],"next":[{"name":"Function Calling","desc":"the underlying mechanism MCP tools use"},{"name":"Tool Interface Design","desc":"MCP tool descriptions follow the same design principles"},{"name":"Agent Loop & Harness","desc":"MCP servers extend what agents can do"},{"name":"Permission Scoping","desc":"MCP servers need access control when shared across clients"}],"quiz":[{"q":"Should you build an MCP server or use custom function calling for an internal Jira tool?","options":["Always MCP — it's the modern standard","Custom function calling if it's app-specific; MCP if you want it reusable across multiple clients","MCP if using Claude Desktop, custom if using the API","Always custom function calling — MCP is for third parties only"],"correct":1,"explain":"The key question is reusability. If multiple teams/apps will use the Jira integration, MCP is worth it — build once, use from any MCP client. For a single-app integration, custom tools are simpler."},{"q":"What's the difference between a Tool and a Resource in MCP?","options":["Tools are free, Resources cost money","Tools take actions with side effects; Resources are read-only data the model can access","Tools are synchronous; Resources are async","Tools require authentication; Resources don't"],"correct":1,"explain":"Tools are callable functions with side effects (create, send, delete). Resources are read-only data exposed for the model to read — like files, DB records, or API responses. Use Resources when no action is needed."},{"q":"Your MCP server exposes customer data. A colleague builds another app using the same server. Security concern?","options":["No concern — MCP handles auth automatically","The colleague's app can access all customer data your server exposes — need auth/authz per client","MCP servers are read-only so no risk","Only a concern if they use a different MCP client"],"correct":1,"explain":"MCP servers don't automatically authenticate clients. Without per-client authentication and authorization, any MCP client connecting to your server can access all exposed resources. Implement auth at the server level."}]},{"id":18,"slug":"workflows-vs-agents","domainKey":"flows","title":"Workflows vs Agents","level":"Beginner","conceptMap":"Workflows vs Agents\n│\n├── Workflows (AI Flows)\n│   ├── Code controls the flow\n│   ├── Model handles individual steps\n│   ├── Predefined, deterministic paths\n│   └── Examples: chaining, routing, parallelization\n│\n├── Agents\n│   ├── Model controls the flow\n│   ├── Tool calls in a loop\n│   ├── Dynamic, emergent paths\n│   └── Examples: research agent, coding agent\n│\n├── Decision Axis\n│   ├── \"Can the path be scripted in advance?\"\n│   │   ├── Yes → Workflow\n│   │   └── No → Agent\n│   ├── Workflow wins: cheaper, predictable, debuggable\n│   └── Agent wins: flexible, handles unknown paths\n│\n└── Connects To\n    ├── Workflow Patterns (specific workflow designs)\n    ├── Agent Loop & Harness (agent internals)\n    └── Human-in-the-Loop (oversight for agents)","sections":[{"title":"Where This Fits","md":"The first design decision in any AI system is whether the model should *execute* steps (workflow) or *decide* steps (agent). Getting this wrong means either over-engineering with agents or under-powering with rigid pipelines."},{"title":"Core Mechanism","md":"**Workflows** — code is in charge:\n\n```python\n# Workflow: summarize → translate → format (steps fixed in code)\ndef process_document(doc):\n    summary = llm.call(\"Summarize: \" + doc)           # step 1\n    translated = llm.call(\"Translate to Spanish: \" + summary)  # step 2\n    formatted = llm.call(\"Format as bullet points: \" + translated)  # step 3\n    return formatted\n```\n\n**Agents** — model is in charge:\n\n```python\n# Agent: model decides what to do next\ndef run_agent(task):\n    messages = [{\"role\": \"user\", \"content\": task}]\n    while True:\n        response = llm.call_with_tools(messages, tools=[search, read_file, write_file])\n        if response.stop_reason == \"end_turn\":\n            return response.text\n        # Execute whatever tools the model chose\n        for tool_call in response.tool_calls:\n            result = execute_tool(tool_call)\n            messages.append(tool_result(result))\n```\n\n**Same task, two approaches:**\n\n```\nDocument ingestion pipeline\n─────────────────────────────────────────────────────\nWORKFLOW approach:\n  [PDF] → extract_text() → chunk() → embed() → store()\n  Path: always the same. Fast. Cheap. Easy to test.\n\nAGENT approach:\n  Model decides: \"Should I OCR this? Is it scanned?\n  What language? Should I summarize first?\"\n  Path: varies per document. Flexible. Expensive. Hard to test.\n\nWinner here: WORKFLOW. Path IS scriptable.\n```"},{"title":"Analogy","md":"Workflows are like **assembly lines** — each station does one thing, parts move in sequence, the factory manager designed the flow. Agents are like **contractors** — you give them the goal, they figure out the steps, call specialists, handle surprises. Assembly lines are efficient for known products. Contractors handle custom jobs."},{"title":"What This Means in Practice","md":"- **Default to workflows** — most business processes can be scripted. Agents are rarely necessary.\n- **Agents for unknown paths**: research tasks, debugging sessions, tasks where the next step depends on what you found.\n- **Cost difference is real**: a workflow makes 3 LLM calls. An agent might make 20+.\n- **Debuggability gap**: workflow fails at step 3 → obvious. Agent fails somewhere in loop → hard to trace.\n- **Hybrid is common**: workflow orchestrates agents as steps. E.g., routing workflow → specialized agent per route."}],"socratic":["A customer support system classifies incoming tickets, routes to departments, and drafts responses. Workflow or agent? Why?","A system that browses the web, reads articles, and synthesizes a research report on any topic. Workflow or agent? Why?","You built an agent for a task that always follows the same 4 steps. What's wrong, and what should you do?"],"socraticIntro":"","myths":[{"m":"Agents are more powerful, always use them","r":"Workflows handle 80% of use cases better — cheaper, predictable, testable"},{"m":"Workflows can't use LLMs","r":"Workflows ARE LLM systems — the LLM handles each step, code handles the flow"},{"m":"Agents are autonomous/self-sufficient","r":"Agents still need a harness, tools, memory, stopping conditions — they're not magic"},{"m":"More agent steps = better result","r":"More steps = more cost, more failure surface, more latency"}],"next":[{"name":"Workflow Patterns","desc":"prompt chaining, routing, parallelization, orchestrator-worker"},{"name":"Agent Loop & Harness","desc":"how agent internals actually work"},{"name":"Human-in-the-Loop","desc":"when agents need oversight"},{"name":"Evals","desc":"how to measure if your workflow/agent works"}],"quiz":[{"q":"Customer support system: classifies tickets, routes to departments, drafts responses. Workflow or agent?","options":["Agent — it makes decisions","Workflow — the path is scripted: classify → route → draft. Code controls flow.","Either — it depends on ticket complexity","Agent, because it uses multiple LLM calls"],"correct":1,"explain":"If you can script the path in advance (classify → route → draft), it's a workflow. The model handles individual steps but code controls the overall flow. No dynamic path-finding needed."},{"q":"A system that browses web, reads articles, synthesizes a research report on any topic. Workflow or agent?","options":["Workflow — web browsing is deterministic","Agent — the model decides which pages to visit, what to read, when to stop","Workflow with a browse step","Either; just add enough prompt steps"],"correct":1,"explain":"The path can't be scripted in advance — it depends on what the model finds. The model decides which links to follow, when it has enough information, and how to synthesize. This is agent territory."},{"q":"You built an agent for a task that always follows the exact same 4 steps. What's wrong?","options":["Nothing — agents are always better than workflows","Over-engineered. If the path is always the same, a workflow is cheaper, faster, and more debuggable.","Agents can't follow fixed steps","You should add more steps to justify the agent"],"correct":1,"explain":"Agents have higher cost (more tokens, more tool calls), less predictability, and harder debugging. If the path is deterministic, use a workflow — reserve agents for genuinely dynamic tasks."}]},{"id":19,"slug":"workflow-patterns","domainKey":"flows","title":"Workflow Patterns","level":"Beginner","conceptMap":"Workflow Patterns\n│\n├── Prompt Chaining\n│   ├── Sequential LLM calls\n│   ├── Output of one → input of next\n│   └── Use: multi-step transformation\n│\n├── Routing\n│   ├── Classifier LLM decides path\n│   ├── Routes to specialized handlers\n│   └── Use: different input types need different pipelines\n│\n├── Parallelization\n│   ├── Multiple independent LLM calls concurrently\n│   ├── Aggregate results after\n│   └── Use: independent subtasks, voting/consensus\n│\n├── Orchestrator-Worker\n│   ├── Orchestrator LLM decomposes task\n│   ├── Worker LLMs execute subtasks\n│   └── Use: complex tasks with dynamic subtasks\n│\n├── Map-Reduce\n│   ├── Map: process N items in parallel\n│   ├── Reduce: combine into single result\n│   └── Use: large document sets, batch processing\n│\n└── Connects To\n    ├── Workflows vs Agents (these ARE the workflow patterns)\n    ├── Agent Loop & Harness (orchestrator-worker → agent territory)\n    └── Cost & Latency Optimization (parallel = faster, not cheaper)","sections":[{"title":"Where This Fits","md":"Once you've decided to use a workflow (not an agent), you need to pick the right pattern. These 5 patterns cover ~95% of real AI workflow designs — most systems are combinations of them."},{"title":"Core Mechanism","md":"### 1. Prompt Chaining\n```\nInput → [LLM 1] → intermediate → [LLM 2] → intermediate → [LLM 3] → Output\n\nUse case: draft → critique → revise\n```\n```python\ndraft = llm(\"Write a blog post about: \" + topic)\ncritique = llm(\"Critique this draft, list 3 weaknesses:\\n\" + draft)\nfinal = llm(f\"Rewrite the draft addressing these critiques:\\nDraft: {draft}\\nCritiques: {critique}\")\n```\n\n### 2. Routing\n```\nInput → [Classifier LLM] → route A → [Specialist A]\n                         → route B → [Specialist B]\n                         → route C → [Specialist C]\n\nUse case: support tickets → billing/technical/general handlers\n```\n```python\ncategory = llm(\"Classify as billing/technical/general: \" + ticket)\nif \"billing\" in category:\n    response = billing_handler(ticket)\nelif \"technical\" in category:\n    response = technical_handler(ticket)\n```\n\n### 3. Parallelization\n```\nInput → [LLM A] ─┐\n       → [LLM B] ─┤→ Aggregator → Output\n       → [LLM C] ─┘\n\nUse case: get 3 opinions, vote on best answer\n```\n```python\nimport asyncio\nresults = await asyncio.gather(\n    llm_async(\"Approach A: \" + task),\n    llm_async(\"Approach B: \" + task),\n    llm_async(\"Approach C: \" + task),\n)\nfinal = llm(\"Pick the best of these 3 approaches:\\n\" + str(results))\n```\n\n### 4. Orchestrator-Worker\n```\nTask → [Orchestrator LLM] → subtask1 → [Worker 1]\n                           → subtask2 → [Worker 2]  → Collect → [Synthesizer]\n                           → subtask3 → [Worker 3]\n\nUse case: research report (orchestrator plans sections, workers write each)\n```\n\n### 5. Map-Reduce\n```\n[doc1, doc2, doc3, ...docN]\n     ↓ map (parallel)\n[summary1, summary2, summary3, ...summaryN]\n     ↓ reduce\n[final synthesis]\n\nUse case: summarize 100 customer reviews into themes\n```"},{"title":"Analogy","md":"These are like **kitchen workflows**: chaining = prep cook → line cook → plating. Routing = host seats you at the right table (bar, main dining, private room). Parallelization = multiple chefs cooking different dishes simultaneously. Orchestrator-worker = head chef assigns stations. Map-reduce = each cook tastes their dish, head chef synthesizes the full meal's balance."},{"title":"What This Means in Practice","md":"- **Chaining adds latency** — each step is sequential. Keep chains short (≤5 steps).\n- **Routing quality matters** — if the classifier misroutes, downstream quality collapses. Eval the classifier separately.\n- **Parallelization cuts wall-clock time but not cost** — 5 parallel calls cost 5x, finish in 1x time.\n- **Orchestrator-worker can become an agent** — when orchestrator's subtasks become dynamic, you've crossed into agent territory.\n- **Map-reduce is underused** — great for any \"process N items\" task. Chunk a book, summarize chunks in parallel, synthesize."}],"socratic":["You need to generate a 10-section report where each section is independent. Which pattern? What's the latency vs cost tradeoff?","A routing classifier sends 15% of inputs to the wrong handler. How do you detect this, and what do you fix?","Your prompt chain has 6 steps. Step 3 hallucinated. Steps 4-6 built on that hallucination. How do you design around this?"],"socraticIntro":"","myths":[{"m":"Parallelization is always faster","r":"Faster wall-clock yes, but rate limits and token costs are the same"},{"m":"Routing needs a powerful model","r":"Classification is simple — use a small/cheap model for the classifier"},{"m":"Orchestrator-worker = multi-agent","r":"Not necessarily — code can orchestrate without LLM orchestrator"},{"m":"These patterns are mutually exclusive","r":"Real systems combine them: routing → parallelization → chaining"}],"next":[{"name":"Agent Loop & Harness","desc":"when patterns aren't enough and the model needs to decide"},{"name":"Parallelization & Async","desc":"engineering parallel LLM calls correctly"},{"name":"Evals","desc":"testing each pattern stage independently"},{"name":"Cost & Latency Optimization","desc":"tuning pattern choice for budget"}],"quiz":[{"q":"Generate a 10-section report where each section is independent. Which pattern? Tradeoff?","options":["Prompt chaining — sequential for quality","Parallelization — run all 10 sections concurrently. Latency: 1x instead of 10x. Cost: same.","Routing — classify each section type","Orchestrator-worker — orchestrator decides section structure"],"correct":1,"explain":"Independent sections can run in parallel. Latency = time for 1 section (not 10). Cost is the same (same total tokens). Parallelization is the obvious choice for independent items."},{"q":"Your routing classifier sends 15% of inputs to the wrong handler. How do you detect this?","options":["Ask users to report wrong department routing","Log classifier decisions and compare against ground truth labels from actual resolutions","Increase classifier temperature","Add more routing handlers"],"correct":1,"explain":"Log every classification decision. After tickets are resolved, compare the classifier's routing to the 'correct' handler inferred from resolution. This gives you accuracy data without real-time human labeling."},{"q":"Your prompt chain has 6 steps. Step 3 hallucinated. Steps 4–6 built on that hallucination. How do you design around this?","options":["Use a better model at step 3","Add validation after each step — detect bad output before it propagates to the next step","Increase the chain to 10 steps for more context","Use parallel chains instead of sequential"],"correct":1,"explain":"Cascade failures in chains are dangerous. Add a validation step after each LLM call — check output for required properties/schema before passing to the next step. Catch errors early, not 3 steps downstream."}]},{"id":20,"slug":"agent-loop-harness","domainKey":"flows","title":"Agent Loop & Harness","level":"Beginner","conceptMap":"Agent Loop & Harness\n│\n├── The Agent Loop\n│   ├── 1. Model generates response + tool calls\n│   ├── 2. Execute tools\n│   ├── 3. Feed results back as messages\n│   ├── 4. Repeat until stopping condition\n│   └── Loop is just a while loop in your code\n│\n├── The Harness (everything around the model)\n│   ├── Loop controller (drives the loop)\n│   ├── Tool executor (runs tool calls safely)\n│   ├── Context manager (maintains message history)\n│   ├── Memory (in-context + external)\n│   ├── Permissions (what tools can/can't do)\n│   ├── Error recovery (handles tool failures)\n│   └── Stopping conditions (knows when to stop)\n│\n├── Stopping Conditions\n│   ├── Model signals completion (stop_reason = end_turn)\n│   ├── Max iteration limit hit\n│   ├── User interrupts\n│   └── Error threshold exceeded\n│\n└── Connects To\n    ├── Tool Use (what the model calls in the loop)\n    ├── Memory Systems (context management at scale)\n    ├── Human-in-the-Loop (pausing the loop for approval)\n    └── Security & Safety (permissions, sandboxing)","sections":[{"title":"Where This Fits","md":"Agents are just models + a loop. The loop is simple. The *harness* — everything that makes the loop safe, reliable, and useful — is where real engineering happens. Claude Code is a production example of a well-built harness."},{"title":"Core Mechanism","md":"### The minimal agent loop (~30 lines)\n\n```python\nimport anthropic\n\nclient = anthropic.Anthropic()\n\ndef run_agent(task: str, tools: list, max_iterations: int = 10):\n    messages = [{\"role\": \"user\", \"content\": task}]\n    \n    for iteration in range(max_iterations):\n        # 1. Call model\n        response = client.messages.create(\n            model=\"claude-sonnet-4-5\",\n            max_tokens=4096,\n            tools=tools,\n            messages=messages,\n        )\n        \n        # 2. Check stopping condition\n        if response.stop_reason == \"end_turn\":\n            return response.content[0].text  # Done\n        \n        # 3. Execute tool calls\n        tool_results = []\n        for block in response.content:\n            if block.type == \"tool_use\":\n                result = execute_tool(block.name, block.input)\n                tool_results.append({\n                    \"type\": \"tool_result\",\n                    \"tool_use_id\": block.id,\n                    \"content\": str(result),\n                })\n        \n        # 4. Feed results back\n        messages.append({\"role\": \"assistant\", \"content\": response.content})\n        messages.append({\"role\": \"user\", \"content\": tool_results})\n    \n    return \"Max iterations reached\"  # Fallback stopping condition\n```\n\n### What a harness adds on top\n\n```\nMinimal loop ─────────────────────────────────────────\n+ Error recovery: tool fails → retry or skip, not crash\n+ Permissions: tool X requires user approval first\n+ Context management: summarize when approaching token limit\n+ Observability: log every tool call + result for debugging\n+ Human checkpoint: pause at step N for human review\n+ Rate limiting: don't hammer external APIs in tight loop\n= Production harness ─────────────────────────────────\n```\n\n### Stopping condition hierarchy\n\n```python\ndef should_stop(response, iteration, errors):\n    if response.stop_reason == \"end_turn\":\n        return True, \"model_done\"\n    if iteration >= MAX_ITERATIONS:\n        return True, \"max_iterations\"\n    if errors >= MAX_ERRORS:\n        return True, \"error_threshold\"\n    if user_interrupted():\n        return True, \"user_interrupt\"\n    return False, None\n```"},{"title":"Analogy","md":"The loop is like a **GPS navigation session** — model decides \"turn left\", you execute the turn, report back current position, model decides next step. The harness is everything else: the car's safety systems, the fuel gauge, the ability to reroute when a road is closed, the \"recalculating\" when you miss a turn. The GPS algorithm (model) is 10% of the system."},{"title":"What This Means in Practice","md":"- **Most agent quality comes from the harness, not the model** — better stopping conditions, error recovery, and context management beat model upgrades.\n- **Max iterations is non-negotiable** — without it, buggy agents run forever and cost a lot.\n- **Tool execution must be sandboxed** — never run model-generated code directly in production without a sandbox.\n- **Log everything** — tool calls, results, iterations. Debugging an agent without logs is nearly impossible.\n- **Context grows each iteration** — after 10-20 iterations, your context window fills. Plan for summarization or pruning."}],"socratic":["Your agent ran 47 iterations before you killed it. It was looping because tool results were ambiguous. What stopping condition and harness feature would have caught this?","The model calls a `delete_file` tool. What should the harness do before executing it?","After 15 iterations, the agent's context window is 90% full. What are two strategies the harness can use to continue?"],"socraticIntro":"","myths":[{"m":"The agent loop is complex","r":"The loop itself is a simple while loop — harness is the complexity"},{"m":"Agents stop when they're done","r":"Only if you tell them how — models can loop indefinitely without stopping conditions"},{"m":"Better model = better agent","r":"Harness quality often matters more than model quality"},{"m":"Tool failures crash agents","r":"Only without error recovery — harness should handle tool failures gracefully"}],"next":[{"name":"Memory Systems","desc":"managing context across iterations and sessions"},{"name":"Human-in-the-Loop","desc":"pausing the loop at critical points"},{"name":"Security & Safety","desc":"sandboxing tool execution, permission scoping"},{"name":"Observability & Tracing","desc":"logging the agent loop for debugging"}],"quiz":[{"q":"Your agent ran 47 iterations before you killed it — it was looping. What harness feature catches this?","options":["Better system prompt","Max iteration limit — stop after N iterations regardless of model state","Larger context window","Forced tool use"],"correct":1,"explain":"A max iteration limit is a fundamental harness safety feature. Set it to 10–20 for most tasks. The agent stops and returns what it has, or escalates to human review."},{"q":"The model calls a delete_file tool. What should the harness do before executing?","options":["Execute immediately — trust the model's judgment","Check if the action is in the allowed action list / requires confirmation before executing","Ask the model 'are you sure?' in the next turn","Log it after execution"],"correct":1,"explain":"Destructive actions (delete, write, send) should go through a permission/confirmation gate in the harness before execution. The harness is the safety layer — don't let the model self-authorize irreversible actions."},{"q":"After 15 iterations, the agent's context window is 90% full. Two harness strategies?","options":["Stop the agent — context limits can't be worked around","Summarize conversation history to compress it, or move old tool results to external memory","Increase max_tokens","Spawn a new agent with empty context"],"correct":1,"explain":"Summarize prior turns into a condensed summary (replacing them in context), or extract important facts into external memory and retrieve them when needed. Both extend the effective context without hitting the limit."}]},{"id":21,"slug":"memory-systems","domainKey":"flows","title":"Memory Systems","level":"Beginner","conceptMap":"Memory Systems\n│\n├── In-Context Memory (ephemeral)\n│   ├── Everything in current message history\n│   ├── Lost when session ends\n│   ├── Limited by context window size\n│   └── Fastest to access (already in context)\n│\n├── External Memory (persistent)\n│   ├── Vector DB (semantic/embedding-based retrieval)\n│   ├── Key-Value store (exact key lookup)\n│   ├── File system / database (structured storage)\n│   └── Survives session end, scales to any size\n│\n├── Memory Types by Content\n│   ├── Episodic: specific past interactions (\"user asked X on Nov 1\")\n│   ├── Semantic: general facts (\"user prefers Python over JS\")\n│   └── Procedural: how to do things (\"user's deploy process is...\")\n│\n├── Memory Operations\n│   ├── Write: when to save, what to save, how to compress\n│   ├── Read: embedding search, exact lookup, recency filter\n│   └── Forget: pruning stale or irrelevant memories\n│\n└── Connects To\n    ├── Embeddings (how vector memory retrieval works)\n    ├── Context Window Management (in-context memory limits)\n    ├── Agent Loop & Harness (memory is a harness component)\n    └── RAG (retrieval pattern applied to memory)","sections":[{"title":"Where This Fits","md":"A stateless agent forgets everything between sessions — every conversation starts from scratch. Memory systems give agents continuity, personalization, and the ability to build on past work. Without memory, agents can't learn from experience or maintain user context."},{"title":"Core Mechanism","md":"### Stateless vs stateful agent\n\n```python\n# STATELESS: no memory between sessions\ndef agent_stateless(task):\n    messages = [{\"role\": \"user\", \"content\": task}]\n    # Only knows what's in this conversation\n    return run_loop(messages)\n\n# STATEFUL: with persistent memory\ndef agent_with_memory(user_id: str, task: str):\n    # 1. Retrieve relevant past memories\n    past_context = memory_store.search(\n        query=task,\n        user_id=user_id,\n        top_k=5\n    )\n    \n    # 2. Build context with memories\n    system = f\"\"\"You are a helpful assistant.\n    \nRelevant context from past interactions:\n{past_context}\"\"\"\n    \n    messages = [{\"role\": \"user\", \"content\": task}]\n    \n    # 3. Run agent\n    result = run_loop(messages, system=system)\n    \n    # 4. Save this interaction to memory\n    memory_store.save(\n        user_id=user_id,\n        content=f\"Task: {task}\\nResult: {result}\",\n        metadata={\"date\": \"2026-11-02\", \"topic\": extract_topic(task)}\n    )\n    \n    return result\n```\n\n### Vector memory store (simplified)\n\n```python\nclass VectorMemoryStore:\n    def __init__(self):\n        self.embedder = EmbeddingModel()\n        self.db = VectorDB()  # e.g., Qdrant, Pinecone\n    \n    def save(self, user_id, content, metadata={}):\n        embedding = self.embedder.embed(content)\n        self.db.upsert(\n            vector=embedding,\n            payload={\"content\": content, \"user_id\": user_id, **metadata}\n        )\n    \n    def search(self, query, user_id, top_k=5):\n        query_embedding = self.embedder.embed(query)\n        results = self.db.search(\n            vector=query_embedding,\n            filter={\"user_id\": user_id},\n            top_k=top_k\n        )\n        return [r.payload[\"content\"] for r in results]\n```\n\n### Memory write strategy — what to save\n\n```\nToo much → memory is noisy, retrieval quality drops\nToo little → loses important context\n\nGood candidates to save:\n✓ User preferences expressed explicitly\n✓ Decisions made and why\n✓ Task outcomes and what worked/didn't\n✓ Domain-specific facts about the user's context\n\nBad candidates:\n✗ Every single turn verbatim (just use conversation history)\n✗ Transient details (\"I'm tired today\")\n✗ Information that changes frequently\n```"},{"title":"Analogy","md":"In-context memory is a **whiteboard** — great for the current session, wiped clean when you leave. External memory is a **filing cabinet** — organized, searchable, survives overnight. Episodic memory is **meeting notes** (\"on Nov 1, user decided to use PostgreSQL\"). Semantic memory is the **reference file** (\"user prefers typed languages\")."},{"title":"What This Means in Practice","md":"- **In-context grows unbounded** — long sessions fill the context window. Summarize periodically or use sliding window.\n- **Vector memory degrades with noise** — write quality > write quantity. Summarize before saving.\n- **Memory retrieval is imperfect** — top-K retrieval misses things. Always let the model ask for more context if needed.\n- **Memory privacy is a concern** — memories persist across sessions. User data stored in memory needs access controls.\n- **Most agents don't need complex memory** — for short-lived tasks, in-context is enough. Add external memory when users need continuity across days."}],"socratic":["A user tells your agent their company uses Kubernetes and prefers Go. Where and how should you store this?","After 30 turns, the agent's context is full. You have 3 options: (a) summarize the conversation, (b) drop the oldest messages, (c) move to external memory. When is each appropriate?","Your agent's memory retrieval returns 5 results but none are relevant to the current query. What went wrong and how do you fix it?"],"socraticIntro":"","myths":[{"m":"More memory = smarter agent","r":"Noisy memory hurts more than no memory — quality of retrieval matters"},{"m":"Context window IS memory","r":"In-context memory is temporary; true memory survives session end"},{"m":"Agents automatically remember things","r":"Memory is engineered — you decide what to save, when, and how to retrieve"},{"m":"Vector search always finds the right memory","r":"Semantic search can miss exact matches; sometimes keyword search is better"}],"next":[{"name":"Embeddings","desc":"how vector memory search actually works"},{"name":"Context Window Management","desc":"managing in-context memory limits"},{"name":"Multi-Agent Systems","desc":"how agents share memory"},{"name":"RAG vs Full Context","desc":"memory retrieval vs stuffing everything in"}],"quiz":[{"q":"A user tells your agent their company uses Kubernetes and prefers Go. Where and how do you store this?","options":["In the system prompt for every conversation","External semantic memory (vector DB or KV store) keyed to user ID — retrieved at session start","In the current conversation only — one-time use","In a relational database with full user profiles"],"correct":1,"explain":"User preferences are semantic memories — persist them in external storage keyed to user ID. Retrieve relevant ones at the start of each session and inject into context. Don't hardcode in system prompt (doesn't scale)."},{"q":"After 30 turns, context is full. When do you summarize vs drop oldest vs move to external memory?","options":["Always summarize — it's most information-preserving","Summarize when info might be needed later; drop when turns are truly irrelevant; external memory for facts you'll need to retrieve specifically","Always drop oldest — it's simplest","External memory only — always","External memory for all"],"correct":1,"explain":"Each strategy has a use case: Summarize when conversation has important continuity. Drop when old turns are truly irrelevant (e.g., exploratory dead-ends). External memory when you need to retrieve specific facts later."},{"q":"Memory retrieval returns 5 results but none are relevant to the current query. What went wrong?","options":["The vector DB is broken","Poor embedding model, bad chunking of memories, or query-memory semantic mismatch — improve how memories are written and indexed","The user asked a question that's never been seen before","Memory retrieval always has 30% irrelevance"],"correct":1,"explain":"Memory retrieval fails for the same reasons RAG fails: poor embedding model, memories stored at wrong granularity, or semantic mismatch between query and stored format. Review how you write and chunk memories."}]},{"id":22,"slug":"multi-agent-systems","domainKey":"flows","title":"Multi-Agent Systems","level":"Beginner","conceptMap":"Multi-Agent Systems\n│\n├── Why Multi-Agent\n│   ├── Specialization: each agent excels at one thing\n│   ├── Parallelism: agents work concurrently\n│   └── Context isolation: each agent has clean context\n│\n├── Architecture Patterns\n│   ├── Orchestrator-Subagent\n│   │   ├── One orchestrator decomposes task\n│   │   ├── Specialized subagents execute\n│   │   └── Orchestrator synthesizes results\n│   └── Peer Agents\n│       ├── Agents as equals, communicate via messages\n│       └── No single controller\n│\n├── Trust & Safety\n│   ├── Don't blindly trust another agent's output\n│   ├── Each agent should validate inputs\n│   └── Subagent permissions ≤ orchestrator permissions\n│\n├── Failure Modes\n│   ├── Cascade failures (one bad result poisons chain)\n│   ├── Conflicting actions (two agents modify same resource)\n│   └── Infinite loops (agents ping-pong indefinitely)\n│\n└── Connects To\n    ├── Agent Loop & Harness (each agent needs its own harness)\n    ├── Human-in-the-Loop (oversight across agent network)\n    └── Security & Safety (trust boundaries between agents)","sections":[{"title":"Where This Fits","md":"Single agents hit limits: context fills up, generalist agents are mediocre at everything, and long tasks can't parallelize. Multi-agent systems solve these by decomposing work across specialized, concurrent agents — but add coordination complexity."},{"title":"Core Mechanism","md":"### Orchestrator-Subagent pattern\n\n```python\n# Code review system as multi-agent\ndef code_review_system(pr_diff: str):\n    \n    # Orchestrator: plan the review\n    plan = orchestrator_agent(f\"\"\"\n    Analyze this PR diff and create a review plan.\n    Assign sections to: security_reviewer, style_reviewer, logic_reviewer\n    PR: {pr_diff}\n    \"\"\")\n    \n    # Subagents work in parallel (context isolated per agent)\n    import asyncio\n    results = asyncio.gather(\n        security_agent(plan.security_section, pr_diff),\n        style_agent(plan.style_section, pr_diff),\n        logic_agent(plan.logic_section, pr_diff),\n    )\n    \n    # Orchestrator synthesizes\n    final_review = orchestrator_agent(f\"\"\"\n    Synthesize these specialist reviews into a coherent PR review:\n    Security: {results[0]}\n    Style: {results[1]}\n    Logic: {results[2]}\n    \"\"\")\n    \n    return final_review\n```\n\n### Why context isolation matters\n\n```\nSingle agent reviewing a large PR:\n  Context: [system prompt] + [entire PR] + [prior analysis] + [tool results]\n  Problem: context fills after 10k lines. Agent loses track of earlier files.\n\nMulti-agent:\n  Orchestrator context: [task breakdown only]\n  Security agent context: [security-relevant sections only]\n  Style agent context:   [style-relevant sections only]\n  \n  Each agent has a fresh, focused context → better results\n```\n\n### Trust boundaries\n\n```python\n# BAD: blindly execute subagent output\ndef orchestrator(task):\n    subagent_output = run_subagent(task)\n    execute_directly(subagent_output)  # dangerous\n\n# GOOD: validate before acting\ndef orchestrator(task):\n    subagent_output = run_subagent(task)\n    validated = validate_output(subagent_output)  # schema check, sanity check\n    if validated.is_safe:\n        execute(validated.result)\n    else:\n        escalate_to_human(subagent_output)\n```"},{"title":"Analogy","md":"A multi-agent system is like a **consulting firm** — the engagement manager (orchestrator) takes the client brief, splits work across specialists (tax expert, legal, strategy), each works in their own domain without cross-contamination, then the manager synthesizes findings into a unified recommendation. The manager doesn't blindly forward the tax expert's memo — they review it first."},{"title":"What This Means in Practice","md":"- **Subagent scope must be narrow** — a subagent that does \"everything\" is just another generalist agent. Specialization is the point.\n- **Orchestrator adds latency** — planning + dispatching + synthesizing is extra overhead. Worth it only for complex tasks.\n- **Don't share mutable state between agents** — concurrent agents writing to the same file/DB causes conflicts. Use message passing instead.\n- **Each agent needs its own harness** — stopping conditions, error handling, context management — per agent, not just for the system.\n- **Cascade failure is real** — if agent A produces bad output and agent B builds on it, the error compounds. Validate at handoff points."}],"socratic":["You have a multi-agent system where the planner agent outputs a JSON task list for executor agents. The executor blindly follows JSON keys. What attack does this enable, and how do you mitigate it?","Two agents both need to update a shared document. What coordination mechanism prevents conflicts?","Your orchestrator spawns 5 subagents. One fails. What should happen? (Consider: retry, skip, abort, escalate — when is each right?)"],"socraticIntro":"","myths":[{"m":"Multi-agent = more powerful","r":"Multi-agent = more complex. Single agents handle most tasks better"},{"m":"Agents can trust each other implicitly","r":"Another agent's output is untrusted data — validate it"},{"m":"Orchestrator needs to be the smartest model","r":"Orchestrators need to plan well; subagents need to execute well — different tasks"},{"m":"More agents = faster","r":"Agents working on dependent tasks are still sequential; parallelism only helps independent work"}],"next":[{"name":"Human-in-the-Loop","desc":"oversight patterns for agent networks"},{"name":"Security & Safety","desc":"trust boundaries, prompt injection across agent calls"},{"name":"Agent Loop & Harness","desc":"each subagent needs its own harness"},{"name":"Workflow Patterns","desc":"orchestrator-worker is also a workflow pattern"}],"quiz":[{"q":"Orchestrator sends JSON task list to executor. Executor blindly follows JSON keys. What attack does this enable?","options":["SQL injection","Prompt injection — malicious content in a task key can hijack the executor's behavior","CSRF attack","Man-in-the-middle attack"],"correct":1,"explain":"If the executor treats any JSON field as instructions without validation, an attacker who can inject data into the task list (via user input, retrieved docs, etc.) can include malicious instructions. Always validate and sanitize inter-agent messages."},{"q":"Two agents both need to update a shared document. What coordination mechanism prevents conflicts?","options":["Run them sequentially instead","Optimistic locking or message queue — one agent holds a lock or they serialize through a queue","Trust the orchestrator to prevent this","Use a read-only document"],"correct":1,"explain":"Concurrent writes to shared state cause conflicts and data corruption. Use optimistic locking (check version before writing), pessimistic locking (acquire lock), or serialize through a message queue."},{"q":"Orchestrator spawns 5 subagents. One fails. When should you abort vs retry vs skip vs escalate?","options":["Always abort — safety first","Retry transient failures; skip if the subtask is non-critical; abort if failure blocks all others; escalate to human if ambiguous","Always retry 3 times then skip","Skip all failures — other agents compensate"],"correct":1,"explain":"Match the response to failure type: transient error (API timeout) → retry; non-critical subtask → skip and continue; blocking dependency → abort chain; ambiguous failure → escalate to human. No one strategy fits all cases."}]},{"id":23,"slug":"human-in-the-loop","domainKey":"flows","title":"Human-in-the-Loop","level":"Beginner","conceptMap":"Human-in-the-Loop\n│\n├── When to Pause for Human\n│   ├── Irreversible actions (delete, send, publish, pay)\n│   ├── High-stakes decisions (production changes, financial)\n│   ├── Ambiguity (agent can't resolve, needs clarification)\n│   └── Low confidence (agent uncertain about approach)\n│\n├── Approval Flow Types\n│   ├── Blocking: agent pauses, waits for human response\n│   └── Async: agent queues action, human approves later\n│\n├── Checkpoint Design\n│   ├── What to show human (action summary, context, options)\n│   ├── What options to offer (approve / reject / modify / escalate)\n│   └── Timeout behavior (auto-reject, escalate, or proceed)\n│\n├── Escalation Patterns\n│   ├── Try auto → confidence low → escalate\n│   ├── Try auto → fail N times → escalate\n│   └── Action type always requires human (policy-based)\n│\n└── Connects To\n    ├── Agent Loop & Harness (checkpoint = pause in the loop)\n    ├── Agentic Risk (irreversible actions need human gates)\n    └── Permission Scoping (what agents can do without approval)","sections":[{"title":"Where This Fits","md":"Agents with real-world tool access can cause real-world harm. Human-in-the-loop checkpoints are the safety layer between \"model decided to do X\" and \"X actually happened.\" The goal isn't to slow agents down — it's to reduce blast radius on high-stakes or irreversible actions."},{"title":"Core Mechanism","md":"### Checkpoint in the agent loop\n\n```python\ndef run_agent_with_checkpoints(task: str):\n    messages = [{\"role\": \"user\", \"content\": task}]\n    \n    for iteration in range(MAX_ITERATIONS):\n        response = llm.call_with_tools(messages, tools=ALL_TOOLS)\n        \n        if response.stop_reason == \"end_turn\":\n            return response.text\n        \n        for tool_call in response.tool_calls:\n            # Check if this action requires human approval\n            if requires_approval(tool_call):\n                approved = ask_human_for_approval(tool_call)\n                if not approved:\n                    # Tell model the action was rejected\n                    tool_result = \"Action rejected by user. Choose a different approach.\"\n                else:\n                    tool_result = execute_tool(tool_call)\n            else:\n                tool_result = execute_tool(tool_call)\n            \n            messages.append(tool_result_message(tool_call.id, tool_result))\n\ndef requires_approval(tool_call) -> bool:\n    HIGH_RISK_TOOLS = {\"delete_file\", \"send_email\", \"make_payment\", \"deploy_to_prod\"}\n    return tool_call.name in HIGH_RISK_TOOLS\n```\n\n### What to show the human (checkpoint UI)\n\n```\n┌─────────────────────────────────────────────┐\n│  Agent wants to perform an action           │\n│                                             │\n│  Action: delete_file                        │\n│  File: /production/user_data/accounts.db    │\n│  Reason: \"Removing outdated database\"       │\n│                                             │\n│  Context: Agent is cleaning up after        │\n│  migration. This file is 2.3GB.             │\n│                                             │\n│  [✓ Approve]  [✗ Reject]  [✎ Modify]       │\n└─────────────────────────────────────────────┘\n```\n\n### Escalation pattern\n\n```python\nMAX_AUTO_RETRIES = 3\n\ndef agent_action_with_escalation(action, context):\n    for attempt in range(MAX_AUTO_RETRIES):\n        result = try_action_automatically(action)\n        if result.success and result.confidence > 0.8:\n            return result\n        if result.is_ambiguous:\n            break  # Don't retry ambiguous — escalate now\n    \n    # Escalate to human\n    return request_human_decision(\n        action=action,\n        context=context,\n        attempts_made=attempt + 1,\n        last_error=result.error\n    )\n```"},{"title":"Analogy","md":"Human-in-the-loop is like **dual-authorization at a bank** — small transactions go through automatically, large transfers require a second approval. The goal isn't to slow all transactions — it's to require a human signature only where the stakes justify it. The bank doesn't ask you to approve every ATM withdrawal, but does call you about a $50k wire transfer."},{"title":"What This Means in Practice","md":"- **Define high-risk actions upfront** — before building the agent, list every action with irreversible effects. Those get checkpoints.\n- **Blocking vs async is a UX decision** — blocking is safer but annoying for background agents. Async works when humans can check a queue.\n- **Show enough context for the human to decide** — \"Agent wants to delete a file. Approve?\" is useless. Show what file, why, what happens if rejected.\n- **Plan for rejected actions** — tell the model the action was rejected and let it find an alternative. Don't just crash.\n- **Timeout policy matters** — if human doesn't respond in 1 hour, auto-reject is usually safer than auto-approve."}],"socratic":["Your agent has tools: `search_web`, `read_file`, `write_file`, `send_slack_message`, `delete_s3_bucket`. Which require human approval? Justify each.","A human rejects an agent's action to \"send a report to all users.\" What should the agent do next?","Your agent runs async (no user present). It encounters an ambiguous situation mid-task. What should it do?"],"socraticIntro":"","myths":[{"m":"Human-in-loop makes agents useless","r":"Only high-risk actions need approval — most agent actions are auto"},{"m":"If the model is confident, skip the human","r":"Confidence ≠ correctness. Irreversibility, not confidence, drives approval requirements"},{"m":"Human approval is a one-time thing","r":"Long tasks may need multiple checkpoints at different stages"},{"m":"Rejected = agent fails","r":"Rejection is feedback — agent should try an alternative approach"}],"next":[{"name":"Agentic Risk","desc":"why irreversible actions are the core safety concern"},{"name":"Permission Scoping","desc":"preventing agents from accessing high-risk tools at all"},{"name":"Agent Loop & Harness","desc":"checkpoint is a harness component"},{"name":"Multi-Agent Systems","desc":"oversight across a network of agents"}],"quiz":[{"q":"Which tools require human approval? search_web, read_file, write_file, send_slack_message, delete_s3_bucket","options":["All of them — always safer to approve","write_file, send_slack_message, delete_s3_bucket — reversible reads are fine; writes/sends/deletes need approval","Only delete_s3_bucket — it's the most dangerous","None — the model is trusted to decide"],"correct":1,"explain":"Read-only actions (search_web, read_file) are low risk. Write, send, and delete are where irreversibility and external effects begin. delete_s3_bucket is obviously high-risk; write_file and send_slack_message affect external state."},{"q":"A human rejects an agent's action to 'send a report to all users.' What should the agent do next?","options":["Retry the same action with different phrasing","Ask for clarification — what should the scope be? All users was wrong, but what IS the right scope?","Abort the entire task","Send it to 10 users instead as a compromise"],"correct":1,"explain":"Rejection without clarification wastes the loop. Ask the human what went wrong and what the correct action should be. The agent should surface its reasoning and ask for guidance, not guess a smaller scope."},{"q":"Your agent runs async (no user present) and hits an ambiguous situation mid-task. What should it do?","options":["Use best judgment and continue — that's what agents are for","Stop, save state, and notify the human asynchronously — never make irreversible decisions without a human available","Abort the entire task","Continue with the most conservative option available"],"correct":1,"explain":"Async agents hitting ambiguity should pause and surface the decision to a human via notification, not self-authorize. Save state so the task can be resumed. Never take irreversible actions in the absence of human oversight."}]},{"id":24,"slug":"eval-design","domainKey":"evals","title":"Eval Design","level":"Beginner","conceptMap":"Eval Design\n│\n├── Test Set Construction\n│   ├── Golden dataset: (input, expected_output) pairs\n│   ├── Size: 50–100 to start, grow to 500+\n│   ├── Coverage: diverse inputs, edge cases, known failures\n│   └── Labeling: human-labeled ground truth vs synthetic\n│\n├── Eval Types (by what they measure)\n│   ├── Accuracy — is the answer correct?\n│   ├── Relevance — is the output on-topic?\n│   ├── Safety — does it violate policy?\n│   ├── Latency — how fast?\n│   └── Cost — tokens consumed?\n│\n├── Eval Frequency\n│   ├── Per-commit (fast evals only)\n│   ├── Nightly (full suite)\n│   └── Pre-deploy (regression gate)\n│\n└── Connects To\n    ├── Code-Graded Evals (how to grade deterministically)\n    ├── Model-Graded Evals (how to grade open-ended)\n    └── Regression Tracking (CI pipeline integration)","sections":[{"title":"Where This Fits","md":"Evals are how you know if your AI system works — without them, every prompt change is a guess. Eval design is the foundation: the quality of your test set determines the quality of every signal you get downstream."},{"title":"Core Mechanism","md":"An eval is a function: `eval(input) → score`. You need three things:\n\n1. **Inputs** — representative queries/tasks your system will face\n2. **Expected outputs** — ground truth to compare against\n3. **Grader** — code or model that compares actual vs expected\n\n### Building a test set\n\n```python\n# Simple eval dataset structure\nevals = [\n    {\n        \"id\": \"support-001\",\n        \"input\": \"My payment failed, what do I do?\",\n        \"expected_category\": \"billing\",\n        \"expected_sentiment\": \"frustrated\",\n        \"tags\": [\"billing\", \"failure\", \"common\"]\n    },\n    {\n        \"id\": \"support-002\",\n        \"input\": \"How do I export my data?\",\n        \"expected_category\": \"data_export\",\n        \"expected_sentiment\": \"neutral\",\n        \"tags\": [\"data\", \"export\", \"feature\"]\n    },\n    # ... 98 more\n]\n```\n\n### Coverage checklist for a classifier eval\n\n```python\ncoverage_requirements = {\n    \"happy_path\": 30,        # typical inputs that should work\n    \"edge_cases\": 20,        # boundary conditions\n    \"known_failures\": 15,    # cases your system has failed before\n    \"adversarial\": 10,       # attempts to confuse the model\n    \"diverse_formats\": 15,   # different phrasing of same intent\n    \"out_of_scope\": 10,      # inputs the system should reject\n}\n# Total: 100 examples minimum\n```\n\n### Quality > quantity\n\n```python\n# Bad: 500 nearly identical examples\nbad_set = [\n    {\"input\": \"refund please\", \"expected\": \"billing\"},\n    {\"input\": \"I want a refund\", \"expected\": \"billing\"},\n    {\"input\": \"can i get refund\", \"expected\": \"billing\"},\n    # ... 497 more billing variations\n]\n\n# Good: 50 diverse examples covering real failure modes\ngood_set = [\n    {\"input\": \"my card was charged twice\", \"expected\": \"billing\"},\n    {\"input\": \"subscription renewed without notice\", \"expected\": \"billing\"},\n    {\"input\": \"the product broke after 2 days\", \"expected\": \"returns\"},\n    {\"input\": \"I need an invoice for my company\", \"expected\": \"billing\"},\n    # covers different intents, edge cases, ambiguous inputs\n]\n```"},{"title":"Analogy","md":"Eval design is like writing a good exam. A bad exam has 100 questions all asking the same thing in different words — students who memorize one answer pass. A good exam has 50 questions covering every important concept, including trick questions that reveal misunderstanding. The exam quality determines whether the grade means anything."},{"title":"What This Means in Practice","md":"- **Start before you build** — write evals for the task before writing the prompt. Forces you to define \"correct.\"\n- **Mine production logs** — best test cases come from real failures, not hypotheticals\n- **Label carefully** — garbage labels → garbage signal. Human review of labels is worth it.\n- **Keep test set secret** — if you optimize against it directly, it stops being a valid test\n- **Separate dev/test split** — use dev set to tune, test set to evaluate final system\n- **Version your eval set** — track what changed and when, like code"}],"socratic":["You're building a customer support router. List 5 categories of inputs you'd want in your test set beyond the obvious \"happy path\" examples.","You have unlimited time to label 100 examples OR unlimited examples auto-labeled by a weaker model. Which do you pick and why?","Your eval accuracy is 92%. Your colleague says \"that's good enough to ship.\" What questions would you ask before agreeing?"],"socraticIntro":"","myths":[{"m":"More examples = better evals","r":"Quality and diversity matter more than quantity. 20 great examples > 200 repetitive ones"},{"m":"I'll add evals after it works","r":"You can't know it works without evals. Write them first or in parallel"},{"m":"My eval set covers everything","r":"It never does — continuously add cases from production failures"},{"m":"Synthetic evals are fine","r":"Synthetic inputs miss the weirdness of real user inputs. Use real data when possible"},{"m":"One eval metric is enough","r":"Most systems need accuracy + safety + latency minimum"}],"next":[{"name":"Code-Graded Evals","desc":"implement deterministic graders for your test set"},{"name":"Model-Graded Evals","desc":"grade open-ended outputs where code grading fails"},{"name":"Regression Tracking","desc":"wire your eval set into CI to catch regressions"},{"name":"Production Concerns","desc":"how prod monitoring feeds new examples into your eval set"}],"quiz":[{"q":"You're building a support router. List which inputs you'd include in your test set beyond happy-path examples.","options":["Only the most common ticket types","Edge cases: ambiguous tickets, multi-issue tickets, angry users, non-English, known misclassifications, empty tickets","Only tickets from the past week","Only tickets where the correct label is known with certainty"],"correct":1,"explain":"Test sets must cover: edge cases, known failure modes, adversarial inputs, multilingual, empty/malformed inputs, and distribution tails. A happy-path-only eval gives false confidence."},{"q":"100 human-labeled examples OR unlimited synthetic labels from a weaker model. Which do you pick?","options":["Unlimited synthetic — more data always wins","100 human-labeled — ground truth quality beats quantity at this scale; synthetic labels from a weaker model systematically mislead","It depends entirely on the task type","50/50 split of both"],"correct":1,"explain":"For evals, label quality is paramount. Synthetic labels from a weaker model encode that model's biases and errors — your eval measures how well you match the weak model, not real quality. Human-labeled ground truth is the gold standard."},{"q":"Your eval accuracy is 92%. Before shipping, what questions do you ask?","options":["None — 92% is clearly good enough","What's the failure distribution? Which categories fail? What's the cost of a miss? Is 92% good enough for this use case?","Is it 95%? If not, keep improving","Is the test set size large enough? (need >1000)"],"correct":1,"explain":"92% overall hides category-level failures. A 50% miss rate on billing tickets is catastrophic even if overall is 92%. Ask: where does it fail? What's the impact of each failure type? What's the acceptable threshold for this use case?"}]},{"id":25,"slug":"code-graded-evals","domainKey":"evals","title":"Code-Graded Evals","level":"Beginner","conceptMap":"Code-Graded Evals\n│\n├── Grader Types\n│   ├── Exact match — output == expected\n│   ├── Contains — expected string in output\n│   ├── Regex — output matches pattern\n│   ├── JSON validation — parses + matches schema\n│   └── Unit test assertions — test output properties\n│\n├── When to Use\n│   ├── Structured output (JSON, YAML, CSV)\n│   ├── Classification tasks (known label set)\n│   ├── Extraction (specific fields from text)\n│   └── Any task with deterministic ground truth\n│\n├── Advantages\n│   ├── Fast — no extra model call\n│   ├── Cheap — no API cost\n│   ├── Deterministic — same input = same grade\n│   └── Easy to CI/CD\n│\n├── Limitations\n│   ├── Brittle for open-ended outputs\n│   ├── Can't judge quality of phrasing\n│   └── Requires clear ground truth\n│\n└── Connects To\n    ├── Eval Design (test set that code grading works against)\n    ├── Model-Graded Evals (for what code grading can't handle)\n    └── Regression Tracking (code evals are fastest in CI)","sections":[{"title":"Where This Fits","md":"Code-graded evals are the cheapest, fastest, most reliable evals you have. Use them whenever the task has a definable correct answer — which is more often than you think. They're the backbone of any eval pipeline."},{"title":"Core Mechanism","md":"### Basic grader patterns\n\n```python\n# 1. Exact match\ndef exact_match(output: str, expected: str) -> bool:\n    return output.strip().lower() == expected.strip().lower()\n\n# 2. Contains check\ndef contains(output: str, expected: str) -> bool:\n    return expected.lower() in output.lower()\n\n# 3. Regex match\nimport re\ndef regex_match(output: str, pattern: str) -> bool:\n    return bool(re.search(pattern, output))\n\n# 4. JSON validation with schema\nfrom pydantic import BaseModel, ValidationError\nimport json\n\nclass ExtractedData(BaseModel):\n    name: str\n    email: str\n    issue_type: str\n\ndef json_valid(output: str) -> tuple[bool, str]:\n    try:\n        data = json.loads(output)\n        ExtractedData(**data)\n        return True, \"valid\"\n    except json.JSONDecodeError:\n        return False, \"not valid JSON\"\n    except ValidationError as e:\n        return False, str(e)\n```\n\n### Full pytest eval suite for a classifier\n\n```python\nimport pytest\nimport anthropic\n\nclient = anthropic.Anthropic()\n\ndef classify(text: str) -> str:\n    \"\"\"Call your actual prompt\"\"\"\n    response = client.messages.create(\n        model=\"claude-haiku-4-5\",\n        max_tokens=10,\n        messages=[{\n            \"role\": \"user\",\n            \"content\": f\"Classify this support ticket into one of: billing, technical, shipping, other.\\nTicket: {text}\\nCategory:\"\n        }]\n    )\n    return response.content[0].text.strip().lower()\n\n# Test cases\nEVAL_SET = [\n    (\"My payment failed\", \"billing\"),\n    (\"App keeps crashing\", \"technical\"),\n    (\"Package not arrived\", \"shipping\"),\n    (\"What are your hours?\", \"other\"),\n    (\"Card charged twice\", \"billing\"),\n    (\"Can't log in\", \"technical\"),\n]\n\n@pytest.mark.parametrize(\"ticket,expected\", EVAL_SET)\ndef test_classifier(ticket, expected):\n    result = classify(ticket)\n    assert result == expected, f\"Got '{result}', expected '{expected}' for: {ticket}\"\n\n# Run: pytest test_evals.py -v\n# Track pass rate across the full set, not just individual tests\n```\n\n### Scoring across the full dataset\n\n```python\ndef run_eval_suite(eval_set: list[tuple]) -> dict:\n    results = []\n    for input_text, expected in eval_set:\n        actual = classify(input_text)\n        passed = exact_match(actual, expected)\n        results.append({\n            \"input\": input_text,\n            \"expected\": expected,\n            \"actual\": actual,\n            \"passed\": passed\n        })\n\n    total = len(results)\n    passed = sum(r[\"passed\"] for r in results)\n    \n    return {\n        \"score\": passed / total,\n        \"passed\": passed,\n        \"total\": total,\n        \"failures\": [r for r in results if not r[\"passed\"]]\n    }\n\nresults = run_eval_suite(EVAL_SET)\nprint(f\"Score: {results['score']:.1%} ({results['passed']}/{results['total']})\")\n# Score: 83.3% (5/6)\n```"},{"title":"Analogy","md":"Code-graded evals are like a spell-checker — fast, cheap, catches clear errors automatically. They can't tell you if your writing is good, but they instantly catch obvious mistakes. You run the spell-checker on everything; you only send it to an editor (model-graded) when you need quality judgment."},{"title":"What This Means in Practice","md":"- **Always start with code grading** — if there's any way to grade deterministically, do it\n- **Partial credit patterns** — for multi-field extraction, score per field extracted correctly\n- **Normalize before comparing** — strip whitespace, lowercase, remove punctuation for text comparisons\n- **JSON is your friend** — force structured output, then validate with schema; grading becomes trivial\n- **Collect failures** — failed evals are your next test cases; log them with inputs\n\n```python\n# Partial credit for multi-field extraction\ndef score_extraction(output: dict, expected: dict) -> float:\n    fields = [\"name\", \"email\", \"phone\", \"issue\"]\n    correct = sum(\n        1 for f in fields\n        if output.get(f, \"\").lower() == expected.get(f, \"\").lower()\n    )\n    return correct / len(fields)\n```"}],"socratic":["You're building a prompt that extracts: name, email, phone, and issue description from support emails. Design a code-graded eval for it. What does the grader check? How do you handle partial extraction?","Your classifier has 87% accuracy on your eval set. How would you find out which category it's worst at?","A teammate says \"we can't code-grade our summarization output.\" How would you challenge that? What parts *could* be code-graded?"],"socraticIntro":"","myths":[{"m":"Code grading only works for exact match tasks","r":"Contains, regex, schema validation cover a huge range of tasks"},{"m":"I need model-graded evals for quality","r":"Use code grading for correctness, model grading for quality — they're complementary"},{"m":"Code evals are too simple","r":"Simple + reliable + cheap beats complex + expensive. Start here"},{"m":"My prompt output is too free-form for code grading","r":"Change the prompt to return structured output — then code grade it"}],"next":[{"name":"Model-Graded Evals","desc":"grade what code can't (quality, coherence, style)"},{"name":"Eval Design","desc":"the test set these graders run against"},{"name":"Regression Tracking","desc":"run these graders in CI on every change"},{"name":"Structured Output","desc":"forcing JSON from models makes code grading easy"}],"quiz":[{"q":"Your prompt extracts name, email, phone from support emails. Design a code-graded eval. What does the grader check?","options":["Ask a human to read both and compare","Check: (1) extracted fields parse to correct types, (2) extracted values match ground truth, (3) score partial extraction (e.g. 3/4 fields correct)","Only check if JSON is valid","Only check if the email field is populated"],"correct":1,"explain":"Code-graded extraction eval: validate JSON structure, type-check each field, compare extracted values against ground truth labels. Partial scoring (fields correct / total fields) gives nuanced signal."},{"q":"Classifier has 87% accuracy overall. How do you find which category it's worst at?","options":["Ask the model to self-evaluate","Compute per-category accuracy: for each label, count correct/total — look for categories with low per-class accuracy","Run the eval on more examples","Check model confidence scores"],"correct":1,"explain":"Aggregate accuracy hides per-category failures. Compute a confusion matrix or per-class accuracy. A category with 50% accuracy drowned in an overall 87% is a real problem you're missing."},{"q":"A teammate says 'we can't code-grade summarization output.' How do you push back?","options":["Agree — summarization needs human judgment","Challenge it: check if key facts are present (contains check), check length is within spec, check no hallucinated entities appear — parts ARE code-gradable","Agree and use LLM-as-judge instead","Only code-grade the input, not the output"],"correct":1,"explain":"Parts of summarization ARE code-gradable: key entities present (regex/contains), output length in range, required sections included, no hallucinated named entities (NER check). Use code grading for what you can, model-graded for the rest."}]},{"id":26,"slug":"model-graded-evals","domainKey":"evals","title":"Model-Graded Evals","level":"Beginner","conceptMap":"Model-Graded Evals\n│\n├── When to Use\n│   ├── Open-ended text output (summaries, explanations)\n│   ├── Quality judgment (clarity, helpfulness, tone)\n│   └── When no clear ground truth exists\n│\n├── LLM-as-Judge Pattern\n│   ├── Input: rubric + question + model output\n│   ├── Judge produces: score + reasoning\n│   └── Judge model: usually stronger than graded model\n│\n├── Rubric Design\n│   ├── Explicit criteria (not vague \"is it good?\")\n│   ├── Numeric scale (1–5 with anchors)\n│   └── Separate dimensions (accuracy ≠ clarity ≠ safety)\n│\n├── Bias Risks\n│   ├── Positional bias — prefers first option in pairwise\n│   ├── Verbosity bias — prefers longer outputs\n│   └── Self-preference — model favors its own style\n│\n├── Mitigations\n│   ├── Swap order in pairwise, average both\n│   ├── Use stronger/different model as judge\n│   └── Calibrate against human labels\n│\n└── Connects To\n    ├── Code-Graded Evals (use code when possible; model grade the rest)\n    ├── Eval Design (test set + rubric design)\n    └── Regression Tracking (model evals in nightly, not per-commit)","sections":[{"title":"Where This Fits","md":"Code grading handles correctness; model grading handles quality. Summaries, explanations, customer replies — anything open-ended needs a judge that can read. LLM-as-judge scales human-quality evaluation to thousands of examples without hiring an annotation team."},{"title":"Core Mechanism","md":"### Basic LLM-as-judge\n\n```python\nimport anthropic\nimport json\n\nclient = anthropic.Anthropic()\n\nJUDGE_PROMPT = \"\"\"You are evaluating an AI assistant's response to a customer support question.\n\nQuestion: {question}\nResponse: {response}\n\nScore the response on each dimension (1-5):\n- Accuracy: Does it correctly address the question? (1=wrong, 5=fully correct)\n- Clarity: Is it easy to understand? (1=confusing, 5=crystal clear)\n- Helpfulness: Does it actually help the user? (1=not helpful, 5=very helpful)\n\nReturn JSON only:\n{{\"accuracy\": \u003c1-5>, \"clarity\": \u003c1-5>, \"helpfulness\": \u003c1-5>, \"reasoning\": \"\u003cone sentence>\"}}\"\"\"\n\ndef judge_response(question: str, response: str) -> dict:\n    result = client.messages.create(\n        model=\"claude-sonnet-4-5\",  # stronger model as judge\n        max_tokens=200,\n        messages=[{\n            \"role\": \"user\",\n            \"content\": JUDGE_PROMPT.format(question=question, response=response)\n        }]\n    )\n    return json.loads(result.content[0].text)\n\n# Example\nscore = judge_response(\n    question=\"How do I cancel my subscription?\",\n    response=\"To cancel, go to Settings > Billing > Cancel Subscription. \"\n             \"Your access continues until the end of the billing period.\"\n)\nprint(score)\n# {\"accuracy\": 5, \"clarity\": 5, \"helpfulness\": 5, \"reasoning\": \"Clear, correct steps.\"}\n```\n\n### Pairwise comparison (more reliable than absolute scoring)\n\n```python\nPAIRWISE_PROMPT = \"\"\"Compare two AI responses to the same question. Pick the better one.\n\nQuestion: {question}\n\nResponse A: {response_a}\nResponse B: {response_b}\n\nWhich response is better overall? Consider: accuracy, helpfulness, clarity.\nReturn JSON: {{\"winner\": \"A\" or \"B\", \"reason\": \"\u003cone sentence>\"}}\nSwap A and B in your reasoning to check for positional bias.\"\"\"\n\ndef pairwise_eval(question: str, response_a: str, response_b: str) -> str:\n    # Run twice with swapped order to detect positional bias\n    result1 = client.messages.create(\n        model=\"claude-sonnet-4-5\",\n        max_tokens=100,\n        messages=[{\"role\": \"user\", \"content\": PAIRWISE_PROMPT.format(\n            question=question, response_a=response_a, response_b=response_b\n        )}]\n    )\n    result2 = client.messages.create(\n        model=\"claude-sonnet-4-5\",\n        max_tokens=100,\n        messages=[{\"role\": \"user\", \"content\": PAIRWISE_PROMPT.format(\n            question=question, response_a=response_b, response_b=response_a  # swapped\n        )}]\n    )\n    \n    r1 = json.loads(result1.content[0].text)\n    r2 = json.loads(result2.content[0].text)\n    \n    # Consistent winner = reliable result\n    winner1 = r1[\"winner\"]\n    winner2 = \"A\" if r2[\"winner\"] == \"B\" else \"B\"  # un-swap\n    \n    if winner1 == winner2:\n        return winner1  # confident\n    return \"tie\"  # inconsistent = tie\n```\n\n### Calibrating against human labels\n\n```python\n# Validate your judge against human labels before trusting it\nhuman_labels = [\n    {\"question\": \"...\", \"response\": \"...\", \"human_score\": 4},\n    # ... 50+ human-labeled examples\n]\n\njudge_scores = [judge_response(e[\"question\"], e[\"response\"]) for e in human_labels]\n\n# Check correlation\nimport numpy as np\nhuman = [e[\"human_score\"] for e in human_labels]\njudge = [s[\"helpfulness\"] for s in judge_scores]\ncorrelation = np.corrcoef(human, judge)[0, 1]\nprint(f\"Judge-human correlation: {correlation:.2f}\")\n# Want > 0.7 to trust the judge\n```"},{"title":"Analogy","md":"Model-graded evals are like having a teaching assistant grade essays using a detailed rubric. The TA isn't the professor (the human expert), but with a good rubric they can grade consistently and at scale. The key is the rubric — a vague \"grade quality 1-10\" produces garbage; a detailed rubric with anchors produces useful signal."},{"title":"What This Means in Practice","md":"- **Model grading costs money** — each eval = one extra API call. Budget accordingly.\n- **Stronger judge = better signal** — use GPT-4 or Claude Sonnet to grade Haiku outputs, not the reverse\n- **Always check for bias** — run pairwise with swapped order at minimum; calibrate against 50 human labels\n- **Separate dimensions** — one score for accuracy, one for clarity. Don't collapse into one \"quality\" score\n- **Log reasoning** — ask judge to explain its score. Spot-check reasoning to catch prompt issues\n\n```python\n# Cost estimate for model-graded evals\neval_set_size = 500\njudge_input_tokens = 400   # rubric + question + response\njudge_output_tokens = 100  # score + reasoning\ncost_per_eval = (judge_input_tokens * 3.0 + judge_output_tokens * 15.0) / 1_000_000  # claude sonnet pricing\ntotal_cost = eval_set_size * cost_per_eval\nprint(f\"Full eval suite cost: ${total_cost:.2f}\")  # ~$0.23 for 500 evals\n```"}],"socratic":["You're evaluating a summarization system. Design a 3-dimension rubric with 1–5 scales and anchors for each score. What are the three dimensions?","Your LLM judge gives Response A a score of 4 and Response B a score of 3. Then you swap the order — now A gets 3 and B gets 4. What does this tell you? What do you do?","Your eval budget is $50/month. You have 1000 test cases. At $0.003 per model-graded eval, can you run the full suite daily? What's your tradeoff?"],"socraticIntro":"","myths":[{"m":"LLM judges are too unreliable","r":"Calibrated judges with good rubrics achieve >0.8 correlation with humans"},{"m":"Use the same model as judge and gradee","r":"Self-preference bias is real. Use a different or stronger model"},{"m":"One quality score is enough","r":"Accuracy and helpfulness can diverge. Score dimensions separately"},{"m":"More detail in rubric = better","r":"Rubrics >500 tokens confuse the judge. Clear, concise anchors work better"},{"m":"Model grading replaces human review","r":"It scales human review — you still need humans to validate the judge"}],"next":[{"name":"Regression Tracking","desc":"run model-graded evals in nightly CI, not per-commit (too expensive)"},{"name":"Code-Graded Evals","desc":"use these first; model grade only what code can't handle"},{"name":"Eval Design","desc":"rubric quality starts at test set design time"},{"name":"Model Selection","desc":"the judge model choice significantly impacts eval reliability"}],"quiz":[{"q":"Judge gives Response A score 4, Response B score 3. Swap order: now A gets 3, B gets 4. What does this tell you?","options":["The judge is broken","Positional bias — the judge consistently scores the first response higher regardless of quality. Mitigate by always averaging both orderings.","The responses changed quality","Temperature variance in the judge model"],"correct":1,"explain":"Positional bias is a known LLM-as-judge failure mode. Always run pairwise evals in both orders and average the scores to cancel out positional preference."},{"q":"Eval budget: $50/month. 1000 test cases. $0.003 per model-graded eval. Can you run the full suite daily?","options":["Yes easily — daily runs are cheap","No — 1000 × $0.003 × 30 days = $90, over budget. Run the full suite weekly; run a fast subset daily.","Yes — $0.003 × 1000 = $3/day × 30 = $90, close enough","Only if you use a cheaper judge model"],"correct":1,"explain":"$0.003 × 1000 = $3/day × 30 = $90 > $50 budget. Run a representative subset (200 cases) daily for $18/month, full suite weekly for trend detection. Budget forces strategic cadence."},{"q":"Design a 3-dimension rubric for a summarization eval with 1–5 scales. What are the three dimensions?","options":["Speed, accuracy, completeness","Factual accuracy (does it contain correct information), Conciseness (no unnecessary length), Coverage (are key points included)","Grammar, spelling, tone","Readability, structure, length"],"correct":1,"explain":"Strong rubric dimensions for summarization: Factual Accuracy (does output contain only true claims from source), Coverage (are all key points included), Conciseness (is it appropriately brief). Each dimension is independently measurable."}]},{"id":27,"slug":"regression-tracking","domainKey":"evals","title":"Regression Tracking","level":"Beginner","conceptMap":"Regression Tracking\n│\n├── Baseline\n│   ├── Record scores from current working system\n│   ├── Store: metric values + date + model + prompt hash\n│   └── Treat as \"passing\" threshold\n│\n├── CI Pipeline\n│   ├── Per-commit: fast code-graded evals only\n│   ├── Nightly: full suite including model-graded\n│   ├── Pre-deploy: regression gate (block if score drops)\n│   └── Alert threshold: score drops >X% → fail build\n│\n├── Metric Drift\n│   ├── Model updates (provider changes model weights)\n│   ├── Data drift (user inputs shift over time)\n│   └── Prompt drift (incremental edits accumulate)\n│\n├── Test Set Hygiene\n│   ├── Keep test set separate from training/tuning data\n│   ├── Version test set like code\n│   └── Grow with production failures (not synthetic data)\n│\n└── Connects To\n    ├── Eval Design (the test set CI runs against)\n    ├── Code-Graded Evals (fastest for CI gates)\n    ├── Model-Graded Evals (nightly, not per-commit)\n    └── Production Engineering (observability feeds new test cases)","sections":[{"title":"Where This Fits","md":"Regression tracking is how you prevent AI systems from silently getting worse. Without it, a prompt edit, model update, or data shift can degrade quality for weeks before anyone notices. It's the CI/CD equivalent for AI — every code change triggers a quality check."},{"title":"Core Mechanism","md":"### Storing a baseline\n\n```python\nimport json\nimport hashlib\nfrom datetime import datetime\n\ndef compute_prompt_hash(system_prompt: str) -> str:\n    return hashlib.sha256(system_prompt.encode()).hexdigest()[:8]\n\ndef save_baseline(eval_results: dict, model: str, system_prompt: str):\n    baseline = {\n        \"timestamp\": datetime.utcnow().isoformat(),\n        \"model\": model,\n        \"prompt_hash\": compute_prompt_hash(system_prompt),\n        \"metrics\": eval_results,\n    }\n    with open(\".eval_baseline.json\", \"w\") as f:\n        json.dump(baseline, f, indent=2)\n    print(f\"Baseline saved: {baseline['metrics']['score']:.1%}\")\n\n# First time: run evals, save as baseline\nresults = run_eval_suite(EVAL_SET)\nsave_baseline(results, model=\"claude-haiku-4-5\", system_prompt=SYSTEM_PROMPT)\n```\n\n### Regression check\n\n```python\nREGRESSION_THRESHOLD = 0.05  # 5% drop = fail\n\ndef check_regression(current_results: dict) -> bool:\n    with open(\".eval_baseline.json\") as f:\n        baseline = json.load(f)\n    \n    baseline_score = baseline[\"metrics\"][\"score\"]\n    current_score = current_results[\"score\"]\n    delta = current_score - baseline_score\n    \n    print(f\
